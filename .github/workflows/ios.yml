name: iOS Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Sklo.xcodeproj
  SCHEME: Sklo
  APP_NAME: Sklo
  BUNDLE_ID: com.godbiy.sklo

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Швидка перевірка, що код компілюється. Падає раніше й із зрозумілішою
      # помилкою, ніж archive, тому йде першим.
      - name: Build for simulator
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive for device (unsigned)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -quiet \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      # xcodebuild -exportArchive вимагає підпису, тому .ipa пакуємо вручну:
      # .ipa — це просто zip із теками Payload/<Name>.app усередині.
      - name: Package unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" \
                "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out"
          zip -qry "$APP_NAME-unsigned.ipa" Payload
          ls -lh "$APP_NAME-unsigned.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 30

      # Рухомий реліз: постійне посилання на найсвіжішу збірку з main,
      # щоб .ipa можна було качати з github.com/Godbiy/MyApp/releases/latest
      # і не лазити щоразу у вкладку Actions.
      - name: Update "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Остання збірка з main
          body: |
            Непідписаний `.ipa`, зібраний з коміту ${{ github.sha }} (build ${{ github.run_number }}).
            Як поставити на айфон — див. [docs/GUIDE.md](https://github.com/Godbiy/MyApp/blob/main/docs/GUIDE.md#3-як-поставити-на-айфон).
          prerelease: true
          files: ${{ runner.temp }}/out/*.ipa

      # На раннері стоїть справжній iOS-симулятор. Єдина нагода побачити
      # застосунок живим, коли під рукою немає ні Mac, ні айфона.
      - name: Run in the simulator and screenshot
        id: shots
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/$APP_NAME.app"
          test -d "$APP" || { echo "::error::не знайдено $APP"; exit 1; }

          # Беремо перший доступний айфон зі списку готових симуляторів.
          UDID=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone[^(]*\(([0-9A-Fa-f-]{36})\)' \
                 | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          echo "симулятор: $UDID"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Чистий рядок стану, щоб знімки не залежали від годинника раннера.
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --cellularBars 4 --wifiBars 3 --batteryState charged --batteryLevel 100

          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"

          # Застосунок сам уміє відкритись на потрібному екрані — тап
          # симулятору не надішлеш, а бачити треба кожен.
          shoot() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@" >/dev/null
            sleep 5
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$name.png"
            echo "знято: $name"
          }

          xcrun simctl ui "$UDID" appearance dark
          # Перший запуск довший: застосунок засіває сховище.
          xcrun simctl launch "$UDID" "$BUNDLE_ID" >/dev/null
          sleep 8

          shoot 01-notes-dark      -uiPane 0
          shoot 02-folders-dark    -uiPane 1
          shoot 03-settings-dark   -uiPane 2
          shoot 04-editor-dark     -uiOpenNote

          xcrun simctl ui "$UDID" appearance light
          shoot 05-notes-light     -uiPane 0
          shoot 06-settings-light  -uiPane 2

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$UDID" || true

      # Знімок не показує руху, а весь застосунок — про рух. Тому окремо
      # ганяємо сценарій користування й пишемо екран.
      - name: Record a walkthrough
        id: video
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices | grep -m1 "(Booted)" \
                 | grep -oE '[0-9A-Fa-f-]{36}' || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available \
                   | grep -oE 'iPhone[^(]*\(([0-9A-Fa-f-]{36})\)' \
                   | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
          fi
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --cellularBars 4 --wifiBars 3 --batteryState charged --batteryLevel 100

          mkdir -p "$RUNNER_TEMP/video"
          xcrun simctl io "$UDID" recordVideo --codec h264 \
            "$RUNNER_TEMP/video/$APP_NAME-walkthrough.mp4" &
          REC=$!
          sleep 2

          set +e
          # Без -quiet: коли прохід зривається, причина має бути в журналі,
          # інакше лишається тільки «TEST FAILED» і жодної підказки.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60
          STATUS=$?
          set -e

          sleep 2
          kill -INT $REC || true
          wait $REC 2>/dev/null || true
          ls -lh "$RUNNER_TEMP/video/" || true
          echo "тест завершився зі станом $STATUS (для відео це не критично)"

      - name: Upload walkthrough video
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-walkthrough-video
          path: ${{ runner.temp }}/video/*.mp4
          if-no-files-found: warn

      - name: Upload screenshots
        if: always() && steps.shots.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn

      # Симуляторну збірку можна закинути в appetize.io і покрутити застосунок
      # у браузері з будь-якої системи — це найближче до живого пристрою,
      # що доступне без Mac.
      - name: Package simulator build
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          zip -qry "$RUNNER_TEMP/out/$APP_NAME-simulator.zip" "$APP_NAME.app"
          ls -lh "$RUNNER_TEMP/out/$APP_NAME-simulator.zip"

      - name: Upload simulator build
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-simulator-app
          path: ${{ runner.temp }}/out/*-simulator.zip
          if-no-files-found: error

      - name: Attach .ipa to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/out/*.ipa
