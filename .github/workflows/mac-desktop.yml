name: Mac Desktop

# Живий робочий стіл macOS із симулятором, доступний із браузера.
#
# Сенс: айфона й Mac під рукою немає, а раннер GitHub — це справжній Mac.
# Вмикаємо на ньому доступ до екрана, загортаємо у веб-клієнт і виводимо
# назовні через тимчасовий тунель. Виходить застосунок, який можна тикати
# мишкою, без жодних реєстрацій і встановлень на своєму боці.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Скільки хвилин тримати сеанс (макс. 300)"
        default: "45"
        required: true
      pane:
        description: "На якому екрані відкрити застосунок: 0 нотатки, 1 теки, 2 налаштування"
        default: "0"
        required: false

concurrency:
  group: mac-desktop
  cancel-in-progress: true

env:
  PROJECT: Sklo.xcodeproj
  SCHEME: Sklo
  APP_NAME: Sklo
  BUNDLE_ID: com.godbiy.sklo

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Симулятор піднімаємо заздалегідь: хай застосунок уже стоїть на екрані,
      # коли підключишся, а не витрачає твої хвилини на збірку.
      - name: Boot the simulator with the app open
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/$APP_NAME.app"
          UDID=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone[^(]*\(([0-9A-Fa-f-]{36})\)' \
                 | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --cellularBars 4 --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$APP"

          # Вікно самого симулятора — інакше на робочому столі буде порожньо.
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 10
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPane "${{ inputs.pane }}" || true
          sleep 3
          # Вивести вікно наперед, інакше на столі буде порожньо.
          osascript -e 'tell application "Simulator" to activate' || true

      - name: Turn on screen sharing
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${VNC_PASSWORD:-}" ]; then
            echo "::error::немає секрету VNC_PASSWORD"
            exit 1
          fi
          # Застарілий протокол VNC тримає рівно 8 символів пароля.
          PW=$(printf '%.8s' "$VNC_PASSWORD")

          # macOS оголошує власну схему автентифікації поруч зі старою VNC, і
          # клієнт обирає саме її — а вона питає обліковий запис системи.
          # Тобто вирішує не VNC-пароль, а пароль акаунта. Ставимо його трьома
          # способами підряд: який спрацює, той і спрацює.
          AUTH_OK=""

          if sudo dscl . -passwd /Users/runner "$PW" 2>/dev/null; then
            echo "спосіб 1 (dscl) відпрацював"
          else
            echo "спосіб 1 (dscl) не вдався"
          fi

          if ! dscl . -authonly runner "$PW" 2>/dev/null; then
            echo "перевірка після способу 1 не пройшла, пробую sysadminctl"
            sudo sysadminctl -resetPasswordFor runner -newPassword "$PW" 2>/dev/null || true
          fi

          if dscl . -authonly runner "$PW" 2>/dev/null; then
            AUTH_OK="runner"
            echo "вхід під runner підтверджено"
          else
            # Останній рубіж: власний обліковий запис, який точно наш.
            echo "створюю окремий обліковий запис vnc"
            sudo dscl . -create /Users/vnc 2>/dev/null || true
            sudo dscl . -create /Users/vnc UserShell /bin/bash
            sudo dscl . -create /Users/vnc RealName "VNC"
            sudo dscl . -create /Users/vnc UniqueID 520
            sudo dscl . -create /Users/vnc PrimaryGroupID 20
            sudo dscl . -create /Users/vnc NFSHomeDirectory /Users/vnc
            sudo dscl . -passwd /Users/vnc "$PW"
            sudo dseditgroup -o edit -a vnc -t user admin
            if dscl . -authonly vnc "$PW" 2>/dev/null; then
              AUTH_OK="vnc"
              echo "вхід під vnc підтверджено"
            fi
          fi

          if [ -z "$AUTH_OK" ]; then
            echo "::error::жоден спосіб не дав робочого входу"
            exit 1
          fi
          echo "VNC_USER=$AUTH_OK" >> "$GITHUB_ENV"

          KICK=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart

          # Тут був недогляд: доступ вмикався, але не казалось, кому саме.
          # Пароль підходив, а права не було — звідси й відмова на вході.
          sudo "$KICK" -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PW" \
            -restart -agent

          sleep 5
          nc -z localhost 5900 && echo "екран віддається на 5900" || echo "::warning::порт 5900 мовчить"

          # Діагностика поруч із адресою: якщо вхід знову не спрацює, причина
          # має бути в мене на руках, а не за сторінкою, яку API не віддає.
          mkdir -p "$RUNNER_TEMP/link"
          {
            echo "=== стан входу ==="
            echo "обраний користувач: $AUTH_OK"
            echo "консольний сеанс належить: $(stat -f '%Su' /dev/console)"
            echo ""
            echo "перевірка пароля:"
            dscl . -authonly runner "$PW" 2>&1 && echo "  runner: так" || echo "  runner: ні"
            dscl . -authonly vnc "$PW" 2>&1 && echo "  vnc: так" || echo "  vnc: ні"
            echo ""
            echo "групи vnc: $(id -Gn vnc 2>&1)"
            echo "налаштування ARD:"
            sudo defaults read /Library/Preferences/com.apple.RemoteManagement 2>&1 | head -20
          } > "$RUNNER_TEMP/link/auth-report.txt" 2>&1
          cat "$RUNNER_TEMP/link/auth-report.txt"

      - name: Publish the screen to a browser
        run: |
          set -euo pipefail

          # Ні noVNC, ні cloudflared не варто брати з Homebrew: формули novnc
          # там немає взагалі, а решта залежить від стану крана. Обидва — це
          # просто файли, тож беремо їх напряму й не залежимо ні від чого.
          NOVNC_DIR="$RUNNER_TEMP/novnc"
          mkdir -p "$NOVNC_DIR"
          curl -sL https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz \
            | tar xz -C "$NOVNC_DIR" --strip-components=1
          test -f "$NOVNC_DIR/vnc.html" || { echo "::error::веб-клієнт не розпакувався"; exit 1; }

          # Власне середовище: системний python3 на раннері захищений від
          # встановлення пакетів напряму.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --upgrade pip websockify

          curl -sL -o "$RUNNER_TEMP/cf.tgz" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz
          tar xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/cf.tgz"
          chmod +x "$RUNNER_TEMP/cloudflared"

          "$RUNNER_TEMP/venv/bin/websockify" --web "$NOVNC_DIR" 6080 localhost:5900 \
            > "$RUNNER_TEMP/websockify.log" 2>&1 &
          sleep 5
          curl -sf -o /dev/null "http://localhost:6080/vnc.html" \
            && echo "веб-клієнт віддається на 6080" \
            || { echo "::error::websockify не піднявся"; cat "$RUNNER_TEMP/websockify.log"; exit 1; }

          "$RUNNER_TEMP/cloudflared" tunnel --url http://localhost:6080 --no-autoupdate \
            > "$RUNNER_TEMP/tunnel.log" 2>&1 &

          # Тунель друкує адресу не одразу — чекаємо, поки з'явиться.
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "${URL:-}" ]; then
            echo "::error::тунель не піднявся"
            cat "$RUNNER_TEMP/tunnel.log"
            exit 1
          fi

          echo "URL=$URL" >> "$GITHUB_ENV"
          {
            echo "## Робочий стіл macOS готовий"
            echo ""
            echo "### [$URL/vnc.html?autoconnect=true&resize=scale]($URL/vnc.html?autoconnect=true&resize=scale)"
            echo ""
            echo "Користувач: **$VNC_USER**, пароль — секрет \`VNC_PASSWORD\`."
            echo ""
            echo "Сеанс живе ${{ inputs.minutes }} хв. Щоб обірвати раніше — зупини цю збірку."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Відкрий це::$URL/vnc.html?autoconnect=true&resize=scale"

          # Журнал працюючої збірки GitHub через API не віддає, а артефакт —
          # віддає одразу після викладення. Це єдиний спосіб дістати адресу,
          # не відкриваючи сторінку очима.
          mkdir -p "$RUNNER_TEMP/link"
          {
            echo "$URL/vnc.html?autoconnect=true&resize=scale"
            echo "користувач: $VNC_USER"
            echo "(вхід перевірено на самому раннері перед публікацією)"
          } > "$RUNNER_TEMP/link/desktop-url.txt"

      - name: Publish the address
        uses: actions/upload-artifact@v5
        with:
          name: desktop-url
          path: ${{ runner.temp }}/link/*.txt
          if-no-files-found: error

      - name: Hold the session open
        run: |
          MIN=${{ inputs.minutes }}
          MIN=$(( MIN > 300 ? 300 : MIN ))
          echo "тримаю сеанс $MIN хв"
          echo "адреса: $URL/vnc.html?autoconnect=true&resize=scale"
          for i in $(seq 1 "$MIN"); do
            sleep 60
            echo "[$i/$MIN хв] живий — $URL/vnc.html"
          done
          echo "час вийшов, вимикаюсь"
