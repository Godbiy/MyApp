name: Sklo

options:
  bundleIdPrefix: com.godbiy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

targets:
  Sklo:
    type: application
    platform: iOS
    sources:
      - path: Sources/Sklo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godbiy.sklo
        PRODUCT_NAME: Sklo
        INFOPLIST_FILE: Sources/Sklo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

  # Ціль існує тільки заради відео: XCUITest — єдине, що вміє тапати по
  # симулятору, а отже єдиний спосіб побачити застосунок у русі без пристрою.
  SkloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Sources/SkloUITests
    dependencies:
      - target: Sklo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godbiy.sklo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sklo

schemes:
  Sklo:
    build:
      targets:
        Sklo: all
        SkloUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SkloUITests
    archive:
      config: Release
