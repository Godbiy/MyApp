<style>
/* ── Токени ──────────────────────────────────────────────────────────────
   Світла тема визначена на :root, темна перевизначає тільки те, що справді
   міняється. Ручний вибір ставить data-theme і б'є системний. */
:root {
  --paper: #f4f1fa;
  --text: #14121c;
  --text-2: rgba(20,18,28,0.62);
  --text-3: rgba(20,18,28,0.45);

  --glass-thin: linear-gradient(145deg, rgba(255,255,255,0.78), rgba(255,255,255,0.46));
  --glass-reg: linear-gradient(145deg, rgba(255,255,255,0.85), rgba(255,255,255,0.52));
  --glass-thick: linear-gradient(150deg, rgba(255,255,255,0.86), rgba(255,255,255,0.55));
  --stroke-thin: rgba(255,255,255,0.88);
  --stroke-reg: rgba(255,255,255,0.92);
  --hi: rgba(255,255,255,1);
  --hi-2: rgba(255,255,255,0.6);
  --shadow: rgba(40,28,80,0.14);
  --shadow-strong: rgba(40,28,80,0.18);
  --dock-active: rgba(20,18,28,0.08);
  --chip-on-bg: rgba(30,22,60,0.92);
  --chip-on-text: #fff;
  --field: rgba(20,18,28,0.06);
  --grain: 0;
  --bloom-blur: 46px;

  --violet: #7C5CFF;
  --teal: #20D0C0;
  --pink: #FF4D8D;
  --amber: #FFB020;

  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif", Georgia, serif;

  /* Одна крива на весь застосунок: швидкий старт, мʼяке гальмування. */
  --ease: cubic-bezier(.22,.9,.28,1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #07070d;
    --text: #ffffff;
    --text-2: rgba(255,255,255,0.64);
    --text-3: rgba(255,255,255,0.46);

    --glass-thin: linear-gradient(145deg, rgba(255,255,255,0.155), rgba(255,255,255,0.05));
    --glass-reg: linear-gradient(145deg, rgba(255,255,255,0.19), rgba(255,255,255,0.06));
    --glass-thick: linear-gradient(150deg, rgba(255,255,255,0.19), rgba(255,255,255,0.055));
    --stroke-thin: rgba(255,255,255,0.16);
    --stroke-reg: rgba(255,255,255,0.20);
    --hi: rgba(255,255,255,0.45);
    --hi-2: rgba(255,255,255,0.07);
    --shadow: rgba(0,0,0,0.34);
    --shadow-strong: rgba(0,0,0,0.45);
    --dock-active: rgba(255,255,255,0.14);
    --chip-on-bg: rgba(255,255,255,0.82);
    --chip-on-text: #0d0d14;
    --field: rgba(255,255,255,0.09);
    --grain: 0.35;
  }
}

:root[data-theme="dark"] {
  --paper: #07070d;
  --text: #ffffff;
  --text-2: rgba(255,255,255,0.64);
  --text-3: rgba(255,255,255,0.46);

  --glass-thin: linear-gradient(145deg, rgba(255,255,255,0.155), rgba(255,255,255,0.05));
  --glass-reg: linear-gradient(145deg, rgba(255,255,255,0.19), rgba(255,255,255,0.06));
  --glass-thick: linear-gradient(150deg, rgba(255,255,255,0.19), rgba(255,255,255,0.055));
  --stroke-thin: rgba(255,255,255,0.16);
  --stroke-reg: rgba(255,255,255,0.20);
  --hi: rgba(255,255,255,0.45);
  --hi-2: rgba(255,255,255,0.07);
  --shadow: rgba(0,0,0,0.34);
  --shadow-strong: rgba(0,0,0,0.45);
  --dock-active: rgba(255,255,255,0.14);
  --chip-on-bg: rgba(255,255,255,0.82);
  --chip-on-text: #0d0d14;
  --field: rgba(255,255,255,0.09);
  --grain: 0.35;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; margin: 0; overscroll-behavior: none; }

body {
  background: var(--paper);
  color: var(--text);
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, textarea { font: inherit; color: inherit; touch-action: manipulation; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
a { color: var(--violet); }
a:hover { color: var(--pink); }

/* ── Тло ──────────────────────────────────────────────────────────────────
   Плями рухаються повільно й з різними періодами (29/37/31/43 с), тому
   візерунок ніколи не повторюється однаково — око не встигає його вивчити. */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--paper); }
#bg .bloom { position: absolute; border-radius: 50%; filter: blur(var(--bloom-blur)); will-change: transform; }
#bg .b1 { background: radial-gradient(closest-side, var(--violet), transparent); width: 120vw; height: 64vh; left: -42vw; top: -20vh; opacity: .54; animation: drift1 29s var(--ease) infinite; }
#bg .b2 { background: radial-gradient(closest-side, var(--teal), transparent); width: 104vw; height: 52vh; right: -44vw; top: 4vh; opacity: .38; animation: drift2 37s var(--ease) infinite; }
#bg .b3 { background: radial-gradient(closest-side, var(--pink), transparent); width: 110vw; height: 54vh; right: -36vw; bottom: -18vh; opacity: .40; animation: drift3 31s var(--ease) infinite; }
#bg .b4 { background: radial-gradient(closest-side, var(--amber), transparent); width: 96vw; height: 46vh; left: -42vw; bottom: -10vh; opacity: .28; animation: drift4 43s var(--ease) infinite; }

@keyframes drift1 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  30% { transform: translate3d(9vw, 7vh, 0) scale(1.16); }
  62% { transform: translate3d(-5vw, 12vh, 0) scale(.92); }
}
@keyframes drift2 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  35% { transform: translate3d(-11vw, 9vh, 0) scale(.9); }
  70% { transform: translate3d(4vw, -6vh, 0) scale(1.2); }
}
@keyframes drift3 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1.04); }
  28% { transform: translate3d(-8vw, -10vh, 0) scale(.94); }
  64% { transform: translate3d(7vw, 5vh, 0) scale(1.18); }
}
@keyframes drift4 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(.98); }
  40% { transform: translate3d(12vw, -8vh, 0) scale(1.22); }
  75% { transform: translate3d(3vw, 6vh, 0) scale(1); }
}

#grain {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: var(--grain);
  background-image: radial-gradient(rgba(255,255,255,0.14) 0.5px, transparent 0.5px);
  background-size: 3px 3px;
}

/* ── Скло ─────────────────────────────────────────────────────────────── */
.g {
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--stroke-thin);
  background: var(--glass-thin);
  box-shadow: inset 0 1px 0 var(--hi), 0 12px 32px var(--shadow);
}
.g-reg {
  background: var(--glass-reg);
  border-color: var(--stroke-reg);
  box-shadow: inset 0 1px 0 var(--hi), 0 12px 32px var(--shadow);
}
.g-thick {
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  background: var(--glass-thick);
  border-color: var(--stroke-reg);
  box-shadow: inset 0 1.5px 0 var(--hi), inset 0 -1px 0 var(--hi-2), 0 16px 40px var(--shadow-strong);
}

/* ── Каркас ───────────────────────────────────────────────────────────── */
#app {
  position: relative; z-index: 2;
  height: 100%; width: 100%;
  /* На телефоні це повна ширина. На ноуті колонка не розтягується через увесь
     екран — картка на 1500 px завширшки не читається. */
  max-width: 560px; margin: 0 auto;
  overflow: hidden;
}

/* Екрани лежать один на одному, щоб під час переходу обидва були на місці. */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  will-change: transform, opacity;
}

/* ── Переходи між екранами ────────────────────────────────────────────── */
@keyframes inFromRight { from { transform: translateX(30px); opacity: 0; } }
@keyframes outToLeft   { to   { transform: translateX(-20px); opacity: 0; } }
@keyframes inFromLeft  { from { transform: translateX(-30px); opacity: 0; } }
@keyframes outToRight  { to   { transform: translateX(30px); opacity: 0; } }
@keyframes inSoft      { from { transform: scale(.982); opacity: 0; } }
@keyframes outSoft     { to   { transform: scale(1.012); opacity: 0; } }

.in-push  { animation: inFromRight .34s var(--ease) both; }
.out-push { animation: outToLeft   .34s var(--ease) both; }
.in-pop   { animation: inFromLeft  .34s var(--ease) both; }
.out-pop  { animation: outToRight  .34s var(--ease) both; }
.in-soft  { animation: inSoft  .26s var(--ease) both; }
.out-soft { animation: outSoft .26s var(--ease) both; }

.head { display: flex; align-items: flex-end; gap: 12px; padding: 12px 20px 0; flex-shrink: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.h1 { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 2px 0 0; }

.icon-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 22px;
}
#theme-btn svg { transition: transform .5s var(--ease); }
#theme-btn:active svg { transform: rotate(80deg); }

.chips { display: flex; gap: 8px; padding: 14px 20px 2px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 17px; border-radius: 19px;
  font-size: 14px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap;
  color: var(--text-2);
  transition: background .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease), transform .12s var(--ease);
  animation: chipIn .34s var(--ease) both;
}
@keyframes chipIn { from { opacity: 0; transform: translateY(7px); } }
.chip.on { background: var(--chip-on-bg); color: var(--chip-on-text); border-color: var(--stroke-reg); }
.chip-add { padding: 0 14px; color: var(--text-3); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.list { display: flex; flex-direction: column; gap: 11px; padding: 16px 20px calc(150px + env(safe-area-inset-bottom)); }

.card {
  display: flex; flex-direction: column; gap: 6px; padding: 15px 16px 14px; border-radius: 23px;
  text-align: left; width: 100%;
  animation: cardIn .42s var(--ease) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }
.card.pin { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--glass-reg); }
.card-top { display: flex; align-items: center; gap: 8px; }
.card-title { flex: 1; min-width: 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.012em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-time { font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap; }
.card-prev { font-family: var(--serif); font-size: 13.5px; line-height: 1.5; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { display: flex; align-items: center; gap: 7px; padding-top: 2px; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--accent); flex-shrink: 0; }
.card-folder { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--text-3); }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 44px 120px; text-align: center; animation: inSoft .3s var(--ease) both; }
.empty h2 { font-size: 17px; font-weight: 800; margin: 0; }
.empty p { font-family: var(--serif); font-size: 14px; line-height: 1.55; color: var(--text-2); margin: 0; }

/* ── Панель ───────────────────────────────────────────────────────────── */
.dock {
  position: absolute; left: 20px; right: 20px;
  bottom: calc(24px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 10px; z-index: 5;
  animation: dockIn .42s var(--ease) both;
}
@keyframes dockIn { from { opacity: 0; transform: translateY(20px); } }
.dock-bar { position: relative; flex: 1; display: flex; align-items: center; height: 62px; padding: 0 8px; border-radius: 31px; }

/* Кружок не перемальовується — він їде. Саме тому це окремий елемент,
   а не клас на активній кнопці. */
.dock-ind {
  position: absolute; left: 8px; top: 8px; bottom: 8px;
  width: calc((100% - 16px) / 3);
  border-radius: 23px; background: var(--dock-active);
  box-shadow: inset 0 1px 0 var(--hi-2);
  transform: translateX(calc(var(--i, 0) * 100%));
}
.dock-btn {
  position: relative; z-index: 1;
  flex: 1; height: 46px; display: flex; align-items: center; justify-content: center;
  border-radius: 23px; color: var(--text-3);
  transition: color .28s var(--ease), transform .22s var(--ease), opacity .2s var(--ease);
}

/* Пошук не займає місця вгорі — він проявляється прямо в панелі, замість
   кнопок. Заразом поле опиняється поруч із клавіатурою, а не над нею. */
.dock-search {
  position: absolute; inset: 8px; z-index: 2;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px; border-radius: 23px;
  background: var(--dock-active);
  opacity: 0; pointer-events: none; transform: scale(.94);
  transition: opacity .24s var(--ease), transform .3s var(--ease);
}
.dock-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; font-weight: 500; }
.dock-search input::placeholder { color: var(--text-3); }
.dock[data-mode="search"] .dock-search { opacity: 1; pointer-events: auto; transform: scale(1); }
.dock[data-mode="search"] .dock-btn { opacity: 0; pointer-events: none; transform: scale(.82); }
.dock[data-mode="search"] .dock-ind { opacity: 0; }
.dock-ind { transition: transform .38s cubic-bezier(.34,1.3,.36,1), opacity .2s var(--ease); }
/* «+» довертається на 45° і стає «×» — та сама кнопка, інша роль. */
.dock[data-mode="search"] .fab svg,
.dock[data-mode="search"] .fab:active svg { transform: rotate(45deg); }
.dock-btn.on { color: var(--text); }
.dock-btn:active { transform: scale(.88); }

.fab {
  width: 62px; height: 62px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 31px; color: #fff;
  background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000));
  border: 1px solid rgba(255,255,255,0.34);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.55), 0 16px 40px var(--shadow-strong);
  transition: transform .18s cubic-bezier(.34,1.5,.4,1), background .3s var(--ease);
}
.fab svg { transition: transform .3s var(--ease); }
.fab:active { transform: scale(.9); }
.fab:active svg { transform: rotate(90deg); }

.card, .chip, .icon-btn, .frow { transition: transform .14s var(--ease); }
.card:active, .frow:active { transform: scale(.975); }
.chip:active, .icon-btn:active { transform: scale(.92); }

/* ── Редактор ─────────────────────────────────────────────────────────── */
.nav { display: flex; align-items: center; gap: 8px; padding: 12px 20px 0; flex-shrink: 0; }
.back { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 16px 0 10px; border-radius: 22px; font-size: 15px; font-weight: 700; transition: transform .14s var(--ease); }
.back:active { transform: scale(.94); }
.paper { margin: 20px 20px calc(150px + env(safe-area-inset-bottom)); padding: 24px 22px 26px; border-radius: 30px; }
.stamp { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
.paper textarea {
  display: block; width: 100%; border: 0; background: none; outline: none; resize: none;
  overflow: hidden; padding: 0; margin: 0;
}
#e-title { font-size: 26px; font-weight: 800; letter-spacing: -.028em; line-height: 1.18; margin-bottom: 14px; }
#e-body { font-family: var(--serif); font-size: 16px; line-height: 1.72; color: var(--text); opacity: .88; }
.paper textarea::placeholder { color: var(--text-3); opacity: 1; }

.todos { display: flex; flex-direction: column; gap: 11px; margin-top: 20px; }
.todo { display: flex; align-items: flex-start; gap: 11px; animation: cardIn .34s var(--ease) both; }
.box {
  width: 24px; height: 24px; flex-shrink: 0; margin-top: 1px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--field); border: 1px solid var(--stroke-reg);
  transition: background .22s var(--ease), border-color .22s var(--ease);
}
.todo.done .box { background: var(--accent); border-color: rgba(255,255,255,0.4); }
.box svg { opacity: 0; transform: scale(.5); transition: opacity .2s var(--ease), transform .28s cubic-bezier(.34,1.6,.4,1); }
.todo.done .box svg { opacity: 1; transform: scale(1); }
.box.pop { animation: boxPop .34s var(--ease); }
@keyframes boxPop { 45% { transform: scale(1.22); } }
.todo input {
  flex: 1; min-width: 0; border: 0; background: none; outline: none;
  font-family: var(--serif); font-size: 15px; line-height: 1.5; padding: 2px 0;
  transition: color .25s var(--ease);
}
.todo.done input { color: var(--text-3); text-decoration: line-through; }
.todo-x { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--text-3); flex-shrink: 0; transition: transform .14s var(--ease); }
.todo-x:active { transform: scale(.85); }

.edock-bar { flex: 1; display: flex; align-items: center; height: 58px; padding: 0 6px; border-radius: 29px; }
.edock-btn { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: transform .16s var(--ease), color .2s; }
.edock-btn:active { transform: scale(.88); }
.done-btn {
  height: 58px; padding: 0 22px; flex-shrink: 0;
  display: flex; align-items: center; border-radius: 29px;
  font-size: 15.5px; font-weight: 700; color: #fff;
  background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000));
  border: 1px solid rgba(255,255,255,0.34);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.55), 0 16px 40px var(--shadow-strong);
  transition: transform .16s var(--ease);
}
.done-btn:active { transform: scale(.94); }

/* ── Теки ─────────────────────────────────────────────────────────────── */
.sect { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 0 4px 11px; }
.frow { display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 20px; width: 100%; text-align: left; animation: cardIn .42s var(--ease) both; }
.fic { width: 40px; height: 40px; flex-shrink: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); }
.fmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fname { font-size: 16px; font-weight: 700; letter-spacing: -.012em; }
.flast { font-family: var(--serif); font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcount { font-size: 13.5px; font-weight: 700; color: var(--text-3); flex-shrink: 0; }

/* ── Аркуш дій ────────────────────────────────────────────────────────── */
#sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
#sheet-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: scrimIn .24s var(--ease) both; }
@keyframes scrimIn { from { opacity: 0; } }
#sheet-card {
  position: relative; width: 100%; max-width: 460px;
  margin: 0 12px calc(12px + env(safe-area-inset-bottom));
  border-radius: 28px; padding: 22px 20px 20px;
  display: flex; flex-direction: column; gap: 12px;
  animation: sheetIn .34s cubic-bezier(.22,1.1,.3,1) both;
}
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } }
#sheet.closing #sheet-card { animation: sheetOut .2s var(--ease) both; }
#sheet.closing #sheet-scrim { animation: scrimIn .2s var(--ease) reverse both; }
@keyframes sheetOut { to { transform: translateY(30px); opacity: 0; } }
#sheet h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
#sheet p { margin: -4px 0 0; font-family: var(--serif); font-size: 14px; line-height: 1.5; color: var(--text-2); }
#sheet input[type=text] {
  height: 48px; border-radius: 16px; padding: 0 14px; width: 100%;
  border: 1px solid var(--stroke-reg); background: var(--field); outline: none; font-size: 16px;
  transition: border-color .22s var(--ease);
}
#sheet input[type=text]:focus { border-color: color-mix(in srgb, var(--accent) 75%, transparent); }
.swatches { display: flex; gap: 10px; }
.swatch { width: 40px; height: 40px; border-radius: 14px; border: 2px solid transparent; transition: transform .2s cubic-bezier(.34,1.5,.4,1), border-color .2s; }
.swatch.on { border-color: var(--text); transform: scale(1.08); }
.sheet-acts { display: flex; gap: 10px; margin-top: 4px; }
.sheet-acts button { flex: 1; height: 48px; border-radius: 18px; font-size: 15.5px; font-weight: 700; transition: transform .14s var(--ease); }
.sheet-acts button:active { transform: scale(.96); }
.btn-ghost { background: var(--field); border: 1px solid var(--stroke-reg); }
.btn-solid { color: #fff; background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000)); }
.btn-danger { color: #fff; background: linear-gradient(150deg, #FF4D6D, #C31F41); }

#toast {
  position: fixed; left: 50%; z-index: 60;
  bottom: calc(104px + env(safe-area-inset-bottom));
  padding: 12px 20px; border-radius: 22px; font-size: 14.5px; font-weight: 600;
  pointer-events: none; opacity: 0;
  transform: translate(-50%, 12px);
  transition: opacity .24s var(--ease), transform .34s cubic-bezier(.22,1.2,.3,1);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Системне «менше руху» вимикає все, крім миттєвої зміни стану. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001s !important;
  }
}
</style>
</head>
<body>

<div id="bg">
  <div class="bloom b1"></div><div class="bloom b2"></div>
  <div class="bloom b3"></div><div class="bloom b4"></div>
</div>
<div id="grain"></div>

<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";

/* ══════════════ Дані ══════════════════════════════════════════════════
   Усе живе в localStorage одним записом. Нічого нікуди не надсилається —
   закрив вкладку, дані лишились у браузері. */

const KEY = "sklo.v1";
const ACCENTS = ["violet", "teal", "pink", "amber"];
const ACCENT_HEX = { violet: "#7C5CFF", teal: "#20D0C0", pink: "#FF4D8D", amber: "#FFB020" };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

let db = { notes: [], folders: [] };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.notes) && Array.isArray(parsed.folders)) {
        db = parsed;
        if (!db.folders.length) db.folders = defaultFolders();
        return;
      }
    }
  } catch (e) { /* зіпсований або недоступний сховок — починаємо з нуля */ }
  seed();
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
  } catch (e) {
    toast("Не вдалось зберегти — сховище браузера недоступне");
  }
}

function defaultFolders() {
  return [
    { id: uid(), name: "Ідеї", accent: "violet" },
    { id: uid(), name: "Робота", accent: "teal" },
    { id: uid(), name: "Побут", accent: "amber" },
    { id: uid(), name: "Особисте", accent: "pink" },
  ];
}

function seed() {
  const folders = defaultFolders();
  db = {
    folders,
    notes: [{
      id: uid(),
      title: "Вітаю у Склі",
      body: "Це звичайна нотатка — гортай, правь, видаляй.\n\nТапни «+» унизу, щоб написати свою. Шпилька зверху закріплює нотатку над рештою, теки фільтрують список.",
      folderID: folders[0].id,
      pinned: true,
      created: Date.now(),
      updated: Date.now(),
      items: [
        { id: uid(), text: "Написати першу нотатку", done: false },
        { id: uid(), text: "Створити свою теку", done: false },
        { id: uid(), text: "Закріпити щось важливе", done: false },
      ],
    }],
  };
  save();
}

const noteById = (id) => db.notes.find((n) => n.id === id);
const folderById = (id) => db.folders.find((f) => f.id === id) || null;
const accentOf = (note) => {
  const f = folderById(note && note.folderID);
  return ACCENT_HEX[f ? f.accent : "violet"];
};

function displayTitle(n) {
  const t = (n.title || "").trim();
  if (t) return t;
  const first = (n.body || "").split("\n").map((s) => s.trim()).filter(Boolean)[0];
  return first || "Без назви";
}

function preview(n) {
  const b = (n.body || "").trim();
  if (b) return b.replace(/\s*\n+\s*/g, " ");
  const items = (n.items || []).map((i) => i.text).filter(Boolean);
  return items.length ? items.join(" · ") : "Порожня нотатка";
}

function isEmptyNote(n) {
  return !(n.title || "").trim() && !(n.body || "").trim()
    && !(n.items || []).some((i) => (i.text || "").trim());
}

function matches(n, q) {
  q = q.trim().toLowerCase();
  if (!q) return true;
  if ((n.title || "").toLowerCase().includes(q)) return true;
  if ((n.body || "").toLowerCase().includes(q)) return true;
  return (n.items || []).some((i) => (i.text || "").toLowerCase().includes(q));
}

/* ══════════════ Дати ══════════════════════════════════════════════════ */

const MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня",
                    "липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_SHORT = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const WEEKDAYS = ["Неділя","Понеділок","Вівторок","Середа","Четвер","Пʼятниця","Субота"];

const sameDay = (a, b) => a.getFullYear() === b.getFullYear()
  && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

const hhmm = (d) => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

function shortStamp(ts) {
  const d = new Date(ts), now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (sameDay(d, now)) return hhmm(d);
  if (sameDay(d, yest)) return "Учора";
  if (d.getFullYear() === now.getFullYear()) return d.getDate() + " " + MONTHS_SHORT[d.getMonth()];
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getFullYear()).slice(2);
}

function fullStamp(ts) {
  const d = new Date(ts), now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (sameDay(d, now)) return "Сьогодні · " + hhmm(d);
  if (sameDay(d, yest)) return "Учора · " + hhmm(d);
  return d.getDate() + " " + MONTHS_GEN[d.getMonth()] + " · " + hhmm(d);
}

function weekdayLine() {
  const d = new Date();
  return WEEKDAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS_GEN[d.getMonth()];
}

/** Місцевий відмінок: «у 1 нотатці», але «у 2 / 11 / 25 нотатках». */
const declension = (n) => (n % 10 === 1 && n % 100 !== 11) ? "нотатці" : "нотатках";

function declensionNom(n) {
  const m100 = n % 100, m10 = n % 10;
  if (m100 >= 11 && m100 <= 14) return "нотаток";
  if (m10 === 1) return "нотатка";
  if (m10 >= 2 && m10 <= 4) return "нотатки";
  return "нотаток";
}

/* ══════════════ Іконки ════════════════════════════════════════════════ */

const ic = (paths, size) => '<svg width="' + (size || 21) + '" height="' + (size || 21) +
  '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
  'stroke-linecap="round" stroke-linejoin="round">' + paths + "</svg>";

const ICONS = {
  list: ic('<path d="M4 6h16M4 12h16M4 18h10"/>'),
  folder: ic('<path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V18a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>'),
  search: ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>', 26),
  plusSm: ic('<path d="M12 5v14M5 12h14"/>', 20),
  plusTiny: ic('<path d="M12 5v14M5 12h14"/>', 16),
  folderPlus: ic('<path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V18a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M12 11v5M9.5 13.5h5"/>', 26),
  back: ic('<path d="M15 5l-7 7 7 7"/>', 20),
  share: ic('<path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 14v5a2 2 0 002 2h12a2 2 0 002-2v-5"/>', 19),
  trash: ic('<path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/>', 19),
  check: ic('<path d="M5 12.5l4.5 4.5L19 7"/>', 14),
  checklist: ic('<path d="M3.5 6.5l1.8 1.8 3-3.4M3.5 13l1.8 1.8 3-3.4M3.5 19.5l1.8 1.8 3-3.4M11.5 6h9M11.5 12.5h9M11.5 19h9"/>', 19),
  minus: ic('<circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/>', 17),
  chevron: ic('<path d="M9 5l7 7-7 7"/>', 15),
  theme: ic('<circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>', 19),
  pin: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M14 2l8 8-3.2 1.1-3.1 6.4-2.6-2.6-5.6 5.6-1.4-1.4 5.6-5.6-2.6-2.6 6.4-3.1z"/></svg>',
  pinFill: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2l8 8-3.2 1.1-3.1 6.4-2.6-2.6-5.6 5.6-1.4-1.4 5.6-5.6-2.6-2.6 6.4-3.1z"/></svg>',
  pinTiny: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2l8 8-3.2 1.1-3.1 6.4-2.6-2.6-5.6 5.6-1.4-1.4 5.6-5.6-2.6-2.6 6.4-3.1z"/></svg>',
  emptyBox: ic('<rect x="3.5" y="3.5" width="17" height="17" rx="4" stroke-dasharray="3 3"/>', 34),
};

/* ══════════════ Каркас екранів ════════════════════════════════════════ */

const ui = { view: "list", tab: "notes", noteID: null, folderID: null, query: "", searching: false };
const app = document.getElementById("app");
let screenEl = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/** Ставить новий екран поверх старого і проводить обидва через перехід. */
function mount(html, anim) {
  const old = screenEl;
  const el = document.createElement("div");
  el.className = "screen";
  el.innerHTML = html;
  app.appendChild(el);
  screenEl = el;

  if (old) {
    // Старий екран ще секунду в DOM — хай не відгукується на пошук по id.
    old.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
    if (anim && !reduceMotion()) {
      old.classList.add("out-" + anim);
      el.classList.add("in-" + anim);
      const gone = () => old.remove();
      old.addEventListener("animationend", gone, { once: true });
      setTimeout(gone, 500); // страховка, якщо анімація не стартувала
    } else {
      old.remove();
    }
  }
  return el;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "g g-thick on";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "g g-thick"; }, 2200);
}

const setAccentVar = (hex) => document.documentElement.style.setProperty("--accent", hex);

/** Затримка появи для списків: перші елементи швидко, далі не довше 260 мс. */
const stagger = (i) => ' style="animation-delay:' + Math.min(i * 42, 260) + 'ms"';

function render(anim) {
  if (ui.view === "editor") renderEditor(anim);
  else if (ui.tab === "folders") renderFolders(anim);
  else renderList(anim);
}

/* ── Список ───────────────────────────────────────────────────────────── */

function renderList(anim) {
  const folder = folderById(ui.folderID);
  setAccentVar(folder ? ACCENT_HEX[folder.accent] : ACCENT_HEX.violet);

  const notes = db.notes
    .filter((n) => !ui.folderID || n.folderID === ui.folderID)
    .filter((n) => matches(n, ui.query))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);

  const total = db.notes.length;

  const chips = [{ id: null, name: "Усі" }].concat(db.folders)
    .map((f, i) => '<button class="chip g' + (ui.folderID === f.id ? " on" : "") +
      '" data-folder="' + (f.id || "") + '"' + stagger(i) + ">" + esc(f.name) + "</button>")
    .join("") +
    '<button class="chip g chip-add" id="chip-add"' + stagger(db.folders.length + 1) +
      ' aria-label="Нова тека">' + ICONS.plusTiny + "<span>Тека</span></button>";

  const cards = notes.map((n, i) => {
    const f = folderById(n.folderID);
    return '<button class="card g' + (n.pinned ? " pin" : "") + '" data-open="' + n.id +
      '" style="--accent:' + accentOf(n) + ";animation-delay:" + Math.min(i * 42, 260) + 'ms">' +
      '<span class="card-top">' +
        (n.pinned ? '<span style="color:' + accentOf(n) + ';display:flex">' + ICONS.pinTiny + "</span>" : "") +
        '<span class="card-title">' + esc(displayTitle(n)) + "</span>" +
        '<span class="card-time">' + shortStamp(n.updated) + "</span>" +
      "</span>" +
      '<span class="card-prev">' + esc(preview(n)) + "</span>" +
      (f ? '<span class="card-foot"><span class="dot"></span><span class="card-folder">' + esc(f.name) + "</span></span>" : "") +
    "</button>";
  }).join("");

  const body = notes.length
    ? '<div class="scroll"><div class="list">' + cards + "</div></div>"
    : '<div class="empty">' +
        '<span style="color:var(--text-3)">' + (ui.query ? ICONS.search : ICONS.emptyBox) + "</span>" +
        "<h2>" + (ui.query ? "Нічого не знайшлось" : "Тут поки порожньо") + "</h2>" +
        "<p>" + (ui.query
          ? "Спробуй інші слова або скинь фільтр теки."
          : "Тапни «+», щоб написати першу нотатку.") + "</p>" +
      "</div>";

  const root = mount(
    '<div class="head">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="eyebrow">' + esc(weekdayLine()) + "</div>" +
        '<h1 class="h1">Нотатки</h1>' +
      "</div>" +
      '<button class="icon-btn g g-reg" id="theme-btn" aria-label="Тема">' + ICONS.theme + "</button>" +
    "</div>" +
    '<div class="chips">' + chips + "</div>" +
    body +
    dockHTML(0, "notes", total),
    anim
  );

  root.querySelector("#theme-btn").onclick = cycleTheme;
  root.querySelector("#chip-add").onclick = newFolder;
  root.querySelectorAll("[data-folder]").forEach((el) => {
    el.onclick = () => {
      ui.folderID = el.dataset.folder || null;
      const f = folderById(ui.folderID);
      setAccentVar(f ? ACCENT_HEX[f.accent] : ACCENT_HEX.violet);
      root.querySelectorAll("[data-folder]").forEach((x) => x.classList.toggle("on", x === el));
      refreshCards(root);
    };
  });
  wireCards(root);
  wireDock(root);
}

/** Оновлює самі картки, не чіпаючи шапку, пошук і чіпи. */
function refreshCards(root) {
  const notes = db.notes
    .filter((n) => !ui.folderID || n.folderID === ui.folderID)
    .filter((n) => matches(n, ui.query))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);

  const host = root.querySelector(".scroll, .empty");
  if (!host) return;

  if (!notes.length) {
    const el = document.createElement("div");
    el.className = "empty";
    el.innerHTML = '<span style="color:var(--text-3)">' + (ui.query ? ICONS.search : ICONS.emptyBox) + "</span>" +
      "<h2>" + (ui.query ? "Нічого не знайшлось" : "Тут поки порожньо") + "</h2>" +
      "<p>" + (ui.query ? "Спробуй інші слова або скинь фільтр теки." : "Тапни «+», щоб написати першу нотатку.") + "</p>";
    host.replaceWith(el);
    return;
  }

  const cards = notes.map((n, i) => {
    const f = folderById(n.folderID);
    return '<button class="card g' + (n.pinned ? " pin" : "") + '" data-open="' + n.id +
      '" style="--accent:' + accentOf(n) + ";animation-delay:" + Math.min(i * 34, 200) + 'ms">' +
      '<span class="card-top">' +
        (n.pinned ? '<span style="color:' + accentOf(n) + ';display:flex">' + ICONS.pinTiny + "</span>" : "") +
        '<span class="card-title">' + esc(displayTitle(n)) + "</span>" +
        '<span class="card-time">' + shortStamp(n.updated) + "</span>" +
      "</span>" +
      '<span class="card-prev">' + esc(preview(n)) + "</span>" +
      (f ? '<span class="card-foot"><span class="dot"></span><span class="card-folder">' + esc(f.name) + "</span></span>" : "") +
    "</button>";
  }).join("");

  if (host.classList.contains("empty")) {
    const el = document.createElement("div");
    el.className = "scroll";
    el.innerHTML = '<div class="list">' + cards + "</div>";
    host.replaceWith(el);
  } else {
    host.querySelector(".list").innerHTML = cards;
  }
  wireCards(root);
}

function wireCards(root) {
  root.querySelectorAll("[data-open]").forEach((el) => {
    el.onclick = () => openNote(el.dataset.open);
    attachLongPress(el, () => noteActions(el.dataset.open));
  });
}

/* ── Теки ─────────────────────────────────────────────────────────────── */

function renderFolders(anim) {
  setAccentVar(ACCENT_HEX.violet);
  const total = db.notes.length;

  const rows = db.folders.map((f, i) => {
    const mine = db.notes.filter((n) => n.folderID === f.id);
    const last = mine.slice().sort((a, b) => b.updated - a.updated)[0];
    return '<button class="frow g" data-pick="' + f.id + '" style="--accent:' + ACCENT_HEX[f.accent] +
      ";animation-delay:" + Math.min(i * 46, 260) + 'ms">' +
      '<span class="fic">' + ICONS.folder + "</span>" +
      '<span class="fmeta"><span class="fname">' + esc(f.name) + "</span>" +
      '<span class="flast">' + esc(last ? displayTitle(last) : "Порожня тека") + "</span></span>" +
      '<span class="fcount">' + mine.length + "</span>" +
      '<span style="color:var(--text-3);display:flex">' + ICONS.chevron + "</span>" +
    "</button>";
  }).join("");

  const root = mount(
    '<div class="head">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="eyebrow">' + total + " " + declensionNom(total) + "</div>" +
        '<h1 class="h1">Теки</h1>' +
      "</div>" +
      '<button class="icon-btn g g-reg" id="add-folder" aria-label="Нова тека">' + ICONS.plusSm + "</button>" +
    "</div>" +
    '<div class="scroll"><div class="list">' +
      '<div class="sect">Мої теки</div>' +
      (rows || '<p style="font-family:var(--serif);color:var(--text-2);padding:0 4px">Тек поки немає. Створи першу кнопкою «+».</p>') +
    "</div></div>" +
    dockHTML(1, "folders"),
    anim
  );

  root.querySelector("#add-folder").onclick = newFolder;
  root.querySelectorAll("[data-pick]").forEach((el) => {
    el.onclick = () => { ui.folderID = el.dataset.pick; ui.tab = "notes"; render("pop"); };
    attachLongPress(el, () => folderActions(el.dataset.pick));
  });
  wireDock(root);
}

/* ── Панель ───────────────────────────────────────────────────────────── */

function dockHTML(index, tab, total) {
  const fab = tab === "folders" ? ICONS.folderPlus : ICONS.plus;
  const label = tab === "folders" ? "Нова тека" : "Нова нотатка";
  const searching = tab === "notes" && ui.searching;
  const field = tab === "notes"
    ? '<div class="dock-search">' + ICONS.search +
        '<input id="q" type="search" enterkeyhint="search" placeholder="Пошук у ' +
        total + " " + declension(total) + '" value="' + esc(ui.query) + '"></div>'
    : "";
  return '<div class="dock" id="dock" data-mode="' + (searching ? "search" : "nav") + '">' +
    '<div class="dock-bar g g-thick">' +
      '<div class="dock-ind" style="--i:' + index + '"></div>' +
      '<button class="dock-btn' + (index === 0 ? " on" : "") + '" data-tab="notes" aria-label="Нотатки">' + ICONS.list + "</button>" +
      '<button class="dock-btn' + (index === 1 ? " on" : "") + '" data-tab="folders" aria-label="Теки">' + ICONS.folder + "</button>" +
      '<button class="dock-btn' + (index === 2 ? " on" : "") + '" data-tab="search" aria-label="Пошук">' + ICONS.search + "</button>" +
      field +
    "</div>" +
    '<button class="fab" id="fab" aria-label="' + label + '">' + fab + "</button>" +
  "</div>";
}

/** Вмикає режим пошуку прямо в панелі, без перемальовування екрана. */
function setSearching(root, on) {
  const dock = root.querySelector("#dock");
  const q = root.querySelector("#q");
  if (!dock || !q) return;
  ui.searching = on;
  dock.dataset.mode = on ? "search" : "nav";
  if (on) {
    q.focus();
  } else {
    q.blur();
    if (ui.query) { ui.query = ""; q.value = ""; refreshCards(root); }
  }
}

/** Рухає кружок і підсвічує відповідну кнопку — без перемальовування. */
function setDock(root, index) {
  const ind = root.querySelector(".dock-ind");
  if (ind) ind.style.setProperty("--i", index);
  root.querySelectorAll(".dock-btn").forEach((b, i) => b.classList.toggle("on", i === index));
}

function wireDock(root) {
  root.querySelectorAll("[data-tab]").forEach((el) => {
    el.onclick = () => {
      const t = el.dataset.tab;
      if (t === "search") {
        // З тек спершу повертаємось у список — поле пошуку живе тільки там.
        if (ui.tab !== "notes") { ui.tab = "notes"; ui.searching = true; render("pop"); return; }
        setSearching(root, true);
        return;
      }
      if (ui.tab === t) return;
      ui.tab = t;
      ui.searching = false;
      render(t === "folders" ? "push" : "pop");
    };
  });

  const q = root.querySelector("#q");
  if (q) {
    q.addEventListener("input", () => {
      ui.query = q.value;
      // Перемальовуємо лише картки — інакше загубиться каретка.
      refreshCards(root);
    });
    q.addEventListener("keydown", (e) => { if (e.key === "Escape") setSearching(root, false); });
    // Клавіатура зникла, а шукати нічого — виходимо з режиму самі.
    q.addEventListener("blur", () => {
      if (!ui.query.trim()) setTimeout(() => {
        if (!ui.query.trim() && document.activeElement !== q) setSearching(root, false);
      }, 120);
    });
    if (ui.searching) requestAnimationFrame(() => q.focus());
  }

  root.querySelector("#fab").onclick = () => {
    if (ui.searching) { setSearching(root, false); return; }
    if (ui.tab === "folders") { newFolder(); return; }
    const note = {
      id: uid(), title: "", body: "", folderID: ui.folderID,
      pinned: false, created: Date.now(), updated: Date.now(), items: [],
    };
    db.notes.push(note);
    save();
    openNote(note.id);
  };
}

/* ── Редактор ─────────────────────────────────────────────────────────── */

function openNote(id) {
  ui.noteID = id;
  ui.view = "editor";
  renderEditor("push");
}

function closeEditor() {
  const n = noteById(ui.noteID);
  // Відкрив, нічого не написав, вийшов — не лишаємо сміття в списку.
  if (n && isEmptyNote(n)) {
    db.notes = db.notes.filter((x) => x.id !== n.id);
    save();
  }
  ui.view = "list";
  ui.noteID = null;
  render("pop");
}

function grow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

function renderEditor(anim) {
  const n = noteById(ui.noteID);
  if (!n) { closeEditor(); return; }
  const f = folderById(n.folderID);
  setAccentVar(accentOf(n));

  const root = mount(
    '<div class="nav">' +
      '<button class="back g g-reg" id="back">' + ICONS.back + "<span>" + esc(f ? f.name : "Нотатки") + "</span></button>" +
      '<div style="flex:1"></div>' +
      '<button class="icon-btn g g-reg" id="pin" aria-label="Закріпити" style="color:' +
        (n.pinned ? accentOf(n) : "var(--text)") + '">' + (n.pinned ? ICONS.pinFill : ICONS.pin) + "</button>" +
      '<button class="icon-btn g g-reg" id="share" aria-label="Поділитися">' + ICONS.share + "</button>" +
    "</div>" +
    '<div class="scroll"><div class="paper g g-reg">' +
      '<div class="stamp" id="stamp">' + fullStamp(n.updated) + "</div>" +
      '<textarea id="e-title" rows="1" placeholder="Заголовок"></textarea>' +
      '<textarea id="e-body" rows="1" placeholder="Почни писати…"></textarea>' +
      '<div class="todos" id="todos"></div>' +
    "</div></div>" +
    '<div class="dock">' +
      '<div class="edock-bar g g-thick">' +
        '<button class="edock-btn" id="add-item" aria-label="Пункт списку">' + ICONS.checklist + "</button>" +
        '<button class="edock-btn" id="del" aria-label="Видалити">' + ICONS.trash + "</button>" +
      "</div>" +
      '<button class="done-btn" id="done">Готово</button>' +
    "</div>",
    anim
  );

  const title = root.querySelector("#e-title");
  const body = root.querySelector("#e-body");
  title.value = n.title || "";
  body.value = n.body || "";
  requestAnimationFrame(() => { grow(title); grow(body); });

  // Поля пишуть у модель напряму — перемальовувати екран на кожну літеру
  // не можна, бо зникне каретка.
  const touch = () => { n.updated = Date.now(); save(); };
  title.addEventListener("input", () => { n.title = title.value; grow(title); touch(); });
  body.addEventListener("input", () => { n.body = body.value; grow(body); touch(); });

  renderTodos(root, n);

  root.querySelector("#back").onclick = closeEditor;
  root.querySelector("#done").onclick = () => {
    if (document.activeElement) document.activeElement.blur();
    closeEditor();
  };
  root.querySelector("#add-item").onclick = () => {
    n.items.push({ id: uid(), text: "", done: false });
    touch();
    renderTodos(root, n);
    const inputs = root.querySelectorAll("#todos input");
    if (inputs.length) inputs[inputs.length - 1].focus();
  };
  root.querySelector("#del").onclick = () => confirmDelete(n.id);
  root.querySelector("#pin").onclick = () => {
    n.pinned = !n.pinned;
    touch();
    const btn = root.querySelector("#pin");
    btn.innerHTML = n.pinned ? ICONS.pinFill : ICONS.pin;
    btn.style.color = n.pinned ? accentOf(n) : "var(--text)";
    toast(n.pinned ? "Закріплено" : "Відкріплено");
  };
  root.querySelector("#share").onclick = () => shareNote(n);
}

function renderTodos(root, n) {
  const host = root.querySelector("#todos");
  if (!host) return;
  host.innerHTML = n.items.map((it, i) =>
    '<div class="todo' + (it.done ? " done" : "") + '" data-item="' + it.id +
      '" style="animation-delay:' + Math.min(i * 36, 200) + 'ms">' +
      '<button class="box" data-toggle="' + it.id + '" aria-label="Готово">' + ICONS.check + "</button>" +
      '<input type="text" value="' + esc(it.text) + '" placeholder="Пункт">' +
      '<button class="todo-x" data-rm="' + it.id + '" aria-label="Прибрати">' + ICONS.minus + "</button>" +
    "</div>").join("");

  host.querySelectorAll("[data-toggle]").forEach((el) => {
    el.onclick = () => {
      const it = n.items.find((x) => x.id === el.dataset.toggle);
      it.done = !it.done;
      n.updated = Date.now(); save();
      el.closest(".todo").classList.toggle("done", it.done);
      el.classList.remove("pop");
      void el.offsetWidth; // перезапуск анімації
      el.classList.add("pop");
    };
  });
  host.querySelectorAll("[data-rm]").forEach((el) => {
    el.onclick = () => {
      n.items = n.items.filter((x) => x.id !== el.dataset.rm);
      n.updated = Date.now(); save();
      renderTodos(root, n);
    };
  });
  host.querySelectorAll(".todo input").forEach((input) => {
    const id = input.closest(".todo").dataset.item;
    input.addEventListener("input", () => {
      const it = n.items.find((x) => x.id === id);
      it.text = input.value;
      n.updated = Date.now(); save();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      n.items.push({ id: uid(), text: "", done: false });
      save();
      renderTodos(root, n);
      const inputs = root.querySelectorAll("#todos input");
      inputs[inputs.length - 1].focus();
    });
  });
}

function shareNote(n) {
  const parts = [displayTitle(n)];
  if ((n.body || "").trim()) parts.push(n.body.trim());
  const items = n.items.filter((i) => i.text.trim()).map((i) => (i.done ? "☑ " : "☐ ") + i.text);
  if (items.length) parts.push(items.join("\n"));
  const text = parts.join("\n\n");

  if (navigator.share) {
    navigator.share({ title: displayTitle(n), text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => toast("Скопійовано"))
      .catch(() => toast("Не вдалось скопіювати"));
  } else {
    toast("Браузер не вміє ділитись");
  }
}

/* ── Аркуш дій ────────────────────────────────────────────────────────── */

function sheet(html, wire) {
  const host = document.createElement("div");
  host.id = "sheet";
  host.innerHTML = '<div id="sheet-scrim"></div><div id="sheet-card" class="g g-thick">' + html + "</div>";
  document.body.appendChild(host);

  const close = () => {
    if (reduceMotion()) { host.remove(); return; }
    host.classList.add("closing");
    setTimeout(() => host.remove(), 220);
  };
  host.querySelector("#sheet-scrim").onclick = close;
  wire(host, close);
  return close;
}

function noteActions(id) {
  const n = noteById(id);
  if (!n) return;
  setAccentVar(accentOf(n));
  sheet(
    "<h3>" + esc(displayTitle(n)) + "</h3>" +
    '<div class="sheet-acts" style="flex-direction:column">' +
      '<button class="btn-ghost" id="a-pin">' + (n.pinned ? "Відкріпити" : "Закріпити") + "</button>" +
      '<button class="btn-danger" id="a-del">Видалити</button>' +
      '<button class="btn-ghost" id="a-cancel">Скасувати</button>' +
    "</div>",
    (host, close) => {
      host.querySelector("#a-pin").onclick = () => {
        n.pinned = !n.pinned; n.updated = Date.now(); save(); close();
        refreshCards(screenEl);
        toast(n.pinned ? "Закріплено" : "Відкріплено");
      };
      host.querySelector("#a-del").onclick = () => { close(); setTimeout(() => confirmDelete(id), 180); };
      host.querySelector("#a-cancel").onclick = close;
    }
  );
}

function confirmDelete(id) {
  const n = noteById(id);
  if (!n) return;
  sheet(
    "<h3>Видалити нотатку?</h3><p>«" + esc(displayTitle(n)) + "» зникне назавжди.</p>" +
    '<div class="sheet-acts">' +
      '<button class="btn-ghost" id="d-no">Скасувати</button>' +
      '<button class="btn-danger" id="d-yes">Видалити</button>' +
    "</div>",
    (host, close) => {
      host.querySelector("#d-no").onclick = close;
      host.querySelector("#d-yes").onclick = () => {
        db.notes = db.notes.filter((x) => x.id !== id);
        save(); close();
        if (ui.view === "editor") { ui.view = "list"; ui.noteID = null; render("pop"); }
        else refreshCards(screenEl);
        toast("Видалено");
      };
    }
  );
}

function folderActions(id) {
  const f = folderById(id);
  if (!f) return;
  setAccentVar(ACCENT_HEX[f.accent]);
  const count = db.notes.filter((n) => n.folderID === id).length;
  sheet(
    "<h3>" + esc(f.name) + "</h3>" +
    "<p>" + (count ? "Нотатки (" + count + ") лишаться, але без теки." : "Тека порожня.") + "</p>" +
    '<div class="sheet-acts">' +
      '<button class="btn-ghost" id="f-no">Скасувати</button>' +
      '<button class="btn-danger" id="f-yes">Видалити теку</button>' +
    "</div>",
    (host, close) => {
      host.querySelector("#f-no").onclick = close;
      host.querySelector("#f-yes").onclick = () => {
        db.folders = db.folders.filter((x) => x.id !== id);
        db.notes.forEach((n) => { if (n.folderID === id) n.folderID = null; });
        if (ui.folderID === id) ui.folderID = null;
        save(); close(); render("soft");
        toast("Теку видалено");
      };
    }
  );
}

function newFolder() {
  const used = db.folders.map((f) => f.accent);
  // Беремо колір, якого ще немає, — теки мають різнитись з першого погляду.
  let accent = ACCENTS.find((a) => !used.includes(a)) || ACCENTS[db.folders.length % ACCENTS.length];
  setAccentVar(ACCENT_HEX[accent]);

  sheet(
    "<h3>Нова тека</h3>" +
    '<input type="text" id="f-name" placeholder="Назва" maxlength="40" autocomplete="off">' +
    '<div class="swatches">' + ACCENTS.map((a) =>
      '<button class="swatch' + (a === accent ? " on" : "") + '" data-acc="' + a +
      '" style="background:' + ACCENT_HEX[a] + '" aria-label="' + a + '"></button>').join("") + "</div>" +
    '<div class="sheet-acts">' +
      '<button class="btn-ghost" id="n-no">Скасувати</button>' +
      '<button class="btn-solid" id="n-yes">Створити</button>' +
    "</div>",
    (host, close) => {
      const input = host.querySelector("#f-name");
      setTimeout(() => input.focus(), 120);
      host.querySelectorAll("[data-acc]").forEach((el) => {
        el.onclick = () => {
          accent = el.dataset.acc;
          setAccentVar(ACCENT_HEX[accent]);
          host.querySelectorAll("[data-acc]").forEach((x) => x.classList.toggle("on", x === el));
        };
      });
      const commit = () => {
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        const folder = { id: uid(), name, accent };
        db.folders.push(folder);
        save(); close();
        ui.folderID = folder.id;
        ui.tab = "notes";
        render("soft");
        toast("Теку «" + name + "» створено");
      };
      host.querySelector("#n-yes").onclick = commit;
      host.querySelector("#n-no").onclick = close;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); });
    }
  );
}

/* ── Довгий тап ───────────────────────────────────────────────────────── */

function attachLongPress(el, fn) {
  let timer = null, moved = false;
  const start = () => {
    moved = false;
    timer = setTimeout(() => {
      if (moved) return;
      el.dataset.longpress = "1";
      if (navigator.vibrate) navigator.vibrate(12);
      fn();
    }, 460);
  };
  const cancel = () => { moved = true; clearTimeout(timer); };
  el.addEventListener("touchstart", start, { passive: true });
  el.addEventListener("touchmove", cancel, { passive: true });
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchcancel", cancel);
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); fn(); });
  // Тап після довгого утримання не має ще й відкривати нотатку.
  el.addEventListener("click", (e) => {
    if (el.dataset.longpress) { e.stopImmediatePropagation(); delete el.dataset.longpress; }
  }, true);
}

/* ── Тема ─────────────────────────────────────────────────────────────── */

function cycleTheme() {
  let cur = "auto";
  try { cur = localStorage.getItem("sklo.theme") || "auto"; } catch (e) {}
  const next = cur === "auto" ? "dark" : cur === "dark" ? "light" : "auto";
  try { localStorage.setItem("sklo.theme", next); } catch (e) {}
  applyTheme();
  toast(next === "auto" ? "Тема: як у системі" : next === "dark" ? "Тема: темна" : "Тема: світла");
}

function applyTheme() {
  let t = "auto";
  try { t = localStorage.getItem("sklo.theme") || "auto"; } catch (e) {}
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);

  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#07070d" : "#f4f1fa");
}

/* ── Старт ────────────────────────────────────────────────────────────── */

// Апаратна «назад» на Android закриває нотатку замість того, щоб виходити зі сторінки.
window.addEventListener("popstate", () => {
  const sheetEl = document.getElementById("sheet");
  if (sheetEl) { sheetEl.remove(); history.pushState({ s: 1 }, ""); return; }
  if (ui.view === "editor") { closeEditor(); history.pushState({ s: 1 }, ""); return; }
  if (ui.searching) { setSearching(screenEl, false); history.pushState({ s: 1 }, ""); return; }
  if (ui.tab !== "notes") { ui.tab = "notes"; render("pop"); history.pushState({ s: 1 }, ""); }
});

applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
setAccentVar(ACCENT_HEX.violet);
load();
render();
history.pushState({ s: 1 }, "");
</script>
</body>
</html>
