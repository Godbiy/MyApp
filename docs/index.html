<style>
/* ── Токени ──────────────────────────────────────────────────────────────
   Світла тема на :root, темна перевизначає лише те, що справді міняється.
   Ручний вибір ставить data-theme і б'є системний. */
:root {
  --paper: #f4f1fa;
  --text: #14121c;
  --text-2: rgba(20,18,28,0.62);
  --text-3: rgba(20,18,28,0.45);

  --glass-thin: linear-gradient(145deg, rgba(255,255,255,calc(0.78 * var(--k))), rgba(255,255,255,calc(0.46 * var(--k))));
  --glass-reg: linear-gradient(145deg, rgba(255,255,255,calc(0.85 * var(--k))), rgba(255,255,255,calc(0.52 * var(--k))));
  --glass-thick: linear-gradient(150deg, rgba(255,255,255,calc(0.86 * var(--k))), rgba(255,255,255,calc(0.55 * var(--k))));
  --stroke-thin: rgba(255,255,255,0.88);
  --stroke-reg: rgba(255,255,255,0.92);
  --hi: rgba(255,255,255,1);
  --hi-2: rgba(255,255,255,0.6);
  --shadow: rgba(40,28,80,0.14);
  --shadow-strong: rgba(40,28,80,0.18);
  --dock-active: rgba(20,18,28,0.08);
  --chip-on-bg: rgba(30,22,60,0.92);
  --chip-on-text: #fff;
  --field: rgba(20,18,28,0.06);
  --grain: 0;
  --track: rgba(20,18,28,0.12);

  --accent: #7C5CFF;
  --blur: 24px;
  --k: 1;          /* щільність скла: множник заливки всіх поверхонь */

  /* Керується з налаштувань */
  --bg-op: 1;
  --spin-dur: 150s;
  --d1: 26s; --d2: 33s; --d3: 29s; --d4: 38s;

  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif", Georgia, serif;
  --ease: cubic-bezier(.22,.9,.28,1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #07070d;
    --text: #ffffff;
    --text-2: rgba(255,255,255,0.64);
    --text-3: rgba(255,255,255,0.46);
    --glass-thin: linear-gradient(145deg, rgba(255,255,255,calc(0.155 * var(--k))), rgba(255,255,255,calc(0.05 * var(--k))));
    --glass-reg: linear-gradient(145deg, rgba(255,255,255,calc(0.19 * var(--k))), rgba(255,255,255,calc(0.06 * var(--k))));
    --glass-thick: linear-gradient(150deg, rgba(255,255,255,calc(0.19 * var(--k))), rgba(255,255,255,calc(0.055 * var(--k))));
    --stroke-thin: rgba(255,255,255,0.16);
    --stroke-reg: rgba(255,255,255,0.20);
    --hi: rgba(255,255,255,0.45);
    --hi-2: rgba(255,255,255,0.07);
    --shadow: rgba(0,0,0,0.34);
    --shadow-strong: rgba(0,0,0,0.45);
    --dock-active: rgba(255,255,255,0.14);
    --chip-on-bg: rgba(255,255,255,0.82);
    --chip-on-text: #0d0d14;
    --field: rgba(255,255,255,0.09);
    --grain: 0.35;
    --track: rgba(255,255,255,0.14);
  }
}

:root[data-theme="dark"] {
  --paper: #07070d;
  --text: #ffffff;
  --text-2: rgba(255,255,255,0.64);
  --text-3: rgba(255,255,255,0.46);
  --glass-thin: linear-gradient(145deg, rgba(255,255,255,calc(0.155 * var(--k))), rgba(255,255,255,calc(0.05 * var(--k))));
  --glass-reg: linear-gradient(145deg, rgba(255,255,255,calc(0.19 * var(--k))), rgba(255,255,255,calc(0.06 * var(--k))));
  --glass-thick: linear-gradient(150deg, rgba(255,255,255,calc(0.19 * var(--k))), rgba(255,255,255,calc(0.055 * var(--k))));
  --stroke-thin: rgba(255,255,255,0.16);
  --stroke-reg: rgba(255,255,255,0.20);
  --hi: rgba(255,255,255,0.45);
  --hi-2: rgba(255,255,255,0.07);
  --shadow: rgba(0,0,0,0.34);
  --shadow-strong: rgba(0,0,0,0.45);
  --dock-active: rgba(255,255,255,0.14);
  --chip-on-bg: rgba(255,255,255,0.82);
  --chip-on-text: #0d0d14;
  --field: rgba(255,255,255,0.09);
  --grain: 0.35;
  --track: rgba(255,255,255,0.14);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  /* Прибита до екрана: коли вилазить клавіатура, браузер не має куди
     прокрутити сторінку, тож шапка не може поїхати за край. */
  position: fixed; inset: 0;
  background: var(--paper); color: var(--text); font-family: var(--ui);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; touch-action: manipulation; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ── Тло ──────────────────────────────────────────────────────────────────
   Два рухи накладаються: кожна пляма дрейфує у своєму періоді, а вся
   карусель повільно обертається. Через це кольори не завмирають і
   візерунок не повторюється тим самим циклом. */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--paper); }
#spin {
  position: absolute; left: 50%; top: 50%;
  width: 200vmax; height: 200vmax; margin: -100vmax 0 0 -100vmax;
  animation: spin var(--spin-dur) linear infinite;
  will-change: transform;
}
@keyframes spin { to { transform: rotate(360deg); } }

#spin .bloom {
  position: absolute; border-radius: 50%; filter: blur(60px);
  opacity: calc(var(--o) * var(--bg-op));
  will-change: transform;
}
.b1 { animation: drift1 var(--d1) var(--ease) infinite; }
.b2 { animation: drift2 var(--d2) var(--ease) infinite; }
.b3 { animation: drift3 var(--d3) var(--ease) infinite; }
.b4 { animation: drift4 var(--d4) var(--ease) infinite; }

@keyframes drift1 {
  0%,100% { transform: translate3d(0,0,0) scale(1); }
  33%     { transform: translate3d(13vmax,9vmax,0) scale(1.25); }
  66%     { transform: translate3d(-9vmax,15vmax,0) scale(.85); }
}
@keyframes drift2 {
  0%,100% { transform: translate3d(0,0,0) scale(1.08); }
  38%     { transform: translate3d(-16vmax,11vmax,0) scale(.82); }
  71%     { transform: translate3d(8vmax,-10vmax,0) scale(1.3); }
}
@keyframes drift3 {
  0%,100% { transform: translate3d(0,0,0) scale(.92); }
  29%     { transform: translate3d(-11vmax,-13vmax,0) scale(1.28); }
  63%     { transform: translate3d(12vmax,8vmax,0) scale(1); }
}
@keyframes drift4 {
  0%,100% { transform: translate3d(0,0,0) scale(1.14); }
  44%     { transform: translate3d(15vmax,-11vmax,0) scale(.86); }
  78%     { transform: translate3d(-7vmax,10vmax,0) scale(1.22); }
}

#grain {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: var(--grain);
  background-image: radial-gradient(rgba(255,255,255,0.14) 0.5px, transparent 0.5px);
  background-size: 3px 3px;
}

/* ── Скло ─────────────────────────────────────────────────────────────── */
.g {
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border: 1px solid var(--stroke-thin);
  background: var(--glass-thin);
  box-shadow: inset 0 1px 0 var(--hi), 0 12px 32px var(--shadow);
}
.g-reg { background: var(--glass-reg); border-color: var(--stroke-reg); }

/* Плоске скло: та сама заливка, штрих і тінь, але без backdrop-filter.
   Для поверхонь, що лежать просто на тлі, — воно вже розмите, тож
   розмивати вдруге коштує по буферу на елемент і не дає нічого видимого.
   Справжнє скло лишається там, де під ним справді проїжджає контент. */
.g-flat { backdrop-filter: none; -webkit-backdrop-filter: none; }
.g-thick {
  backdrop-filter: blur(calc(var(--blur) * 1.25)) saturate(200%);
  -webkit-backdrop-filter: blur(calc(var(--blur) * 1.25)) saturate(200%);
  background: var(--glass-thick); border-color: var(--stroke-reg);
  box-shadow: inset 0 1.5px 0 var(--hi), inset 0 -1px 0 var(--hi-2), 0 16px 40px var(--shadow-strong);
}

/* ── Каркас ───────────────────────────────────────────────────────────────
   Шапка й панель стоять намертво. Рухається лише сторінка між ними. */
#app {
  position: relative; z-index: 2;
  /* Висота живого вікна: із клавіатурою вона менша, і панель сідає просто
     над нею замість того, щоб ховатись під нею. */
  height: var(--vh, 100%); width: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  overflow: hidden;
}

.head {
  display: flex; align-items: flex-end; gap: 12px; padding: 12px 20px 0; flex-shrink: 0;
  height: 68px; overflow: hidden;
  transition: height .34s var(--ease), opacity .24s var(--ease),
              transform .34s var(--ease), padding-top .34s var(--ease);
}
/* Під час пошуку заголовок нічого не додає — тож іде геть і віддає місце. */
#app[data-search="on"] .head { height: 0; padding-top: 0; opacity: 0; transform: translateY(-10px); }

.head-txt { position: relative; flex: 1; min-width: 0; height: 56px; }
.ht { position: absolute; left: 0; right: 0; top: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.h1 { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 2px 0 0; }
/* Старий текст іде вгору, новий одночасно приходить знизу. Порожньої паузи
   між ними немає — саме вона й читалась як смикання. */
.ht.in  { animation: htIn .34s var(--ease) both; }
.ht.out { animation: htOut .28s var(--ease) both; pointer-events: none; }
@keyframes htIn  { from { opacity: 0; transform: translateY(14px); } }
@keyframes htOut { to   { opacity: 0; transform: translateY(-14px); } }

/* ── Сторінки ─────────────────────────────────────────────────────────── */
.pager {
  flex: 1; min-height: 0; display: flex;
  touch-action: pan-y;
  transform: translate3d(calc(var(--p, 0) * -100%), 0, 0);
  transition: transform .42s var(--ease);
  will-change: transform;
}
.pager.dragging { transition: none; }
.pane {
  flex: 0 0 100%; width: 100%; min-width: 0;
  display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none;
}
.pane::-webkit-scrollbar { display: none; width: 0; height: 0; }
.pad { padding: 16px 20px calc(150px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 11px; }

.chips {
  /* Відступ дає margin, а не padding: тоді край прокрутки збігається з краєм
     карток, і чіпи ховаються рівно під ним, а не біжать до краю екрана. */
  display: flex; gap: 8px; margin: 0 20px; padding: 14px 0 8px; overflow-x: auto;
  flex-shrink: 0; touch-action: pan-x;
  scrollbar-width: none; -ms-overflow-style: none;
}
/* display:none не всюди прибирає накладну смугу на Android — нульовий
   розмір надійніший. */
.chips::-webkit-scrollbar { display: none; width: 0; height: 0; }
.chip {
  /* Без власної важкої тіні: чіп лежить просто на тлі, а великій тіні ніде
     поміститись — контейнер прокрутки зрізав її за 2px і лишав сірий мазок
     із рівним краєм під усією стрічкою. */
  box-shadow: inset 0 1px 0 var(--hi);
  display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 17px; border-radius: 19px;
  font-size: 14px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; color: var(--text-2);
  transition: background .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease), transform .14s var(--ease);
}
.chip.on { background: var(--chip-on-bg); color: var(--chip-on-text); border-color: var(--stroke-reg); }
.chip-add { padding: 0 14px; color: var(--text-3); }

.card {
  display: flex; flex-direction: column; gap: 6px; padding: 15px 16px 14px; border-radius: 23px;
  text-align: left; width: 100%;
  /* Картки поза екраном не малюються й не розмиваються — саме на цьому
     дохла прокрутка, бо кожна з них тримала власний backdrop-filter. */
  content-visibility: auto;
  contain-intrinsic-size: auto 96px;
}
/* Дані лежать у localStorage і з'являються миттєво. Вдавати завантаження
   каскадом — брехня, яку око читає як гальмо, тож список входить цілим. */
.pad.fresh { animation: listIn .3s var(--ease) both; }
@keyframes listIn { from { opacity: 0; transform: translateY(8px); } }
.card.pin { border-color: color-mix(in srgb, var(--row-accent) 55%, transparent); background: var(--glass-reg); }
.card-top { display: flex; align-items: center; gap: 8px; }
.card-title { flex: 1; min-width: 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.012em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-time { font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap; }
.card-prev { font-family: var(--serif); font-size: 13.5px; line-height: 1.5; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { display: flex; align-items: center; gap: 7px; padding-top: 2px; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--row-accent); flex-shrink: 0; }
.card-folder { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--text-3); }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 44px 140px; text-align: center; }
.empty h2 { font-size: 17px; font-weight: 800; margin: 0; }
.empty p { font-family: var(--serif); font-size: 14px; line-height: 1.55; color: var(--text-2); margin: 0; }

/* ── Панель ───────────────────────────────────────────────────────────── */
.dock {
  position: absolute; left: 20px; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 10px; z-index: 10;
}
.dock-bar { position: relative; flex: 1; display: flex; align-items: center; height: 62px; padding: 0 8px; border-radius: 31px; }

/* Єдине, що рухається внизу. Під час свайпу їде разом зі сторінкою. */
.dock-ind {
  position: absolute; left: 8px; top: 8px; bottom: 8px;
  width: calc((100% - 16px) / 4);
  border-radius: 23px; background: var(--dock-active);
  box-shadow: inset 0 1px 0 var(--hi-2);
  transform: translate3d(calc(var(--i, 0) * 100%), 0, 0);
  transition: transform .42s var(--ease), opacity .2s var(--ease);
}
.dock-ind.live { transition: opacity .2s var(--ease); }
.dock-btn {
  position: relative; z-index: 1; flex: 1; height: 46px;
  display: flex; align-items: center; justify-content: center; border-radius: 23px;
  color: var(--text-3);
  transition: color .3s var(--ease), transform .2s var(--ease), opacity .2s var(--ease);
}
.dock-btn.on { color: var(--text); }
.dock-btn:active { transform: scale(.86); }

/* Пошук не займає місця вгорі — проявляється прямо в панелі, замість кнопок,
   і опиняється поруч із клавіатурою, а не над нею. */
.dock-search {
  position: absolute; inset: 8px; z-index: 2;
  display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 23px;
  background: var(--dock-active);
  opacity: 0; pointer-events: none; transform: scale(.94);
  transition: opacity .24s var(--ease), transform .3s var(--ease);
}
.dock-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; font-weight: 500; }
.dock-search input::placeholder { color: var(--text-3); }
.dock[data-mode="search"] .dock-search { opacity: 1; pointer-events: auto; transform: scale(1); }
.dock[data-mode="search"] .dock-btn { opacity: 0; pointer-events: none; transform: scale(.82); }
.dock[data-mode="search"] .dock-ind { opacity: 0; }

.fab {
  width: 62px; height: 62px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 31px; color: #fff;
  background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000));
  border: 1px solid rgba(255,255,255,0.34);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.55), 0 16px 40px var(--shadow-strong);
  transition: transform .18s cubic-bezier(.34,1.5,.4,1), background .3s var(--ease);
}
.fab svg { transition: transform .34s var(--ease); }
.fab:active { transform: scale(.9); }
/* «+» довертається на 45° і стає «×» — та сама кнопка, інша роль. */
.dock[data-mode="search"] .fab svg { transform: rotate(45deg); }

.icon-btn { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; }
.card, .chip, .icon-btn, .frow { transition: transform .14s var(--ease); }
.card:active, .frow:active { transform: scale(.975); }
.chip:active, .icon-btn:active { transform: scale(.92); }

/* ── Редактор ─────────────────────────────────────────────────────────────
   Єдиний екран, який справді накриває інтерфейс, — тому він і їде поверх. */
.editor {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  animation: edIn .36s var(--ease) both;
}
.editor.closing { animation: edOut .28s var(--ease) both; }
@keyframes edIn  { from { transform: translateX(100%); } }
@keyframes edOut { to   { transform: translateX(100%); } }
/* Під редактором тло густішає, щоб список не просвічував крізь скло. */
.editor::before { content: ""; position: absolute; inset: 0; background: var(--paper); opacity: .55; }
/* z-index, а не position: relative. Воно піднімало вміст над цією заливкою,
   але заразом перебивало position:absolute у панелі — та переставала
   слухати right:20px, розтягувалась на всю ширину й виносила «Готово» за
   край екрана. Елементи флекс-контейнера слухають z-index і без position. */
.editor > * { z-index: 1; }

.nav { display: flex; align-items: center; gap: 8px; padding: 12px 20px 0; flex-shrink: 0; }
.back {
  display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 16px 0 10px;
  border-radius: 22px; font-size: 15px; font-weight: 700;
  /* Довга назва теки інакше роздуває кнопку на пів екрана, а текст
     переноситься у два рядки всередині 44-піксельної пігулки. */
  max-width: 52%; min-width: 0;
  transition: transform .14s var(--ease);
}
.back svg { flex-shrink: 0; }
.back span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back:active { transform: scale(.94); }
.ed-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
.ed-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
.paper { margin: 20px 20px calc(150px + env(safe-area-inset-bottom)); padding: 24px 22px 26px; border-radius: 30px; }
.stamp { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
.paper textarea { display: block; width: 100%; border: 0; background: none; outline: none; resize: none; overflow: hidden; padding: 0; margin: 0; }
#e-title { font-size: 26px; font-weight: 800; letter-spacing: -.028em; line-height: 1.18; margin-bottom: 14px; }
#e-body { font-family: var(--serif); font-size: 16px; line-height: 1.72; opacity: .88; }
.paper textarea::placeholder { color: var(--text-3); opacity: 1; }

.todos { display: flex; flex-direction: column; gap: 11px; margin-top: 20px; }
.todo { display: flex; align-items: flex-start; gap: 11px; }
.box {
  width: 24px; height: 24px; flex-shrink: 0; margin-top: 1px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--field); border: 1px solid var(--stroke-reg);
  transition: background .22s var(--ease), border-color .22s var(--ease);
}
.todo.done .box { background: var(--accent); border-color: rgba(255,255,255,0.4); }
.box svg { opacity: 0; transform: scale(.5); transition: opacity .2s var(--ease), transform .28s cubic-bezier(.34,1.6,.4,1); }
.todo.done .box svg { opacity: 1; transform: scale(1); }
.box.pop { animation: boxPop .34s var(--ease); }
@keyframes boxPop { 45% { transform: scale(1.22); } }
.todo input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-family: var(--serif); font-size: 15px; line-height: 1.5; padding: 2px 0; transition: color .25s var(--ease); }
.todo.done input { color: var(--text-3); text-decoration: line-through; }
.todo-x { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--text-3); flex-shrink: 0; transition: transform .14s var(--ease); }
.todo-x:active { transform: scale(.85); }

.edock-bar { flex: 1; display: flex; align-items: center; height: 62px; padding: 0 8px; border-radius: 31px; }
.edock-btn { flex: 1; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 23px; color: var(--text-2); transition: transform .18s var(--ease); }
.edock-btn:active { transform: scale(.86); }
/* Та сама геометрія, що й «+» у списку: текстова кнопка на вузькому екрані
   змагалась за ширину з рештою панелі й не влазила. */
.done-btn {
  width: 62px; height: 62px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 31px; color: #fff;
  background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000));
  border: 1px solid rgba(255,255,255,0.34);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.55), 0 16px 40px var(--shadow-strong);
  transition: transform .18s cubic-bezier(.34,1.5,.4,1);
}
.done-btn:active { transform: scale(.9); }

/* ── Теки ─────────────────────────────────────────────────────────────── */
.sect { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 0 4px; }
.frow { display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 20px; width: 100%; text-align: left; }
.fic { width: 40px; height: 40px; flex-shrink: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(145deg, var(--row-accent), color-mix(in srgb, var(--row-accent) 70%, #000)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); }
.fmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fname { font-size: 16px; font-weight: 700; letter-spacing: -.012em; }
.flast { font-family: var(--serif); font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcount { font-size: 13.5px; font-weight: 700; color: var(--text-3); flex-shrink: 0; }

/* ── Налаштування ─────────────────────────────────────────────────────── */
.grp { border-radius: 24px; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.grp-t { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.set { display: flex; flex-direction: column; gap: 9px; }
.set-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.set-l { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.set-v { font-size: 13px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
.set-h { font-family: var(--serif); font-size: 12.5px; line-height: 1.5; color: var(--text-3); margin: -2px 0 0; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--field); }
.seg button { flex: 1; height: 38px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-2); transition: background .22s var(--ease), color .22s var(--ease); }
.seg button.on { background: var(--chip-on-bg); color: var(--chip-on-text); }

.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; border-radius: 14px; border: 2px solid transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); transition: transform .2s cubic-bezier(.34,1.5,.4,1), border-color .2s; }
.swatch.on { border-color: var(--text); transform: scale(1.08); }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: none; outline: none; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 24px; height: 24px; margin-top: -9px;
  border-radius: 12px; background: var(--accent); border: 2px solid rgba(255,255,255,.6);
  box-shadow: 0 3px 10px var(--shadow-strong); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 11px; background: var(--accent);
  border: 2px solid rgba(255,255,255,.6); box-shadow: 0 3px 10px var(--shadow-strong); cursor: pointer;
}

.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--track); position: relative; transition: background .24s var(--ease); flex-shrink: 0; }
.sw.on { background: var(--accent); }
.sw::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px;
  background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.28);
  transition: transform .28s cubic-bezier(.34,1.4,.4,1);
}
.sw.on::after { transform: translateX(20px); }

.seedrow { display: flex; align-items: center; gap: 10px; }
.seedval { flex: 1; height: 44px; border-radius: 16px; background: var(--field); display: flex; align-items: center; padding: 0 14px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.btn-sm { height: 44px; padding: 0 16px; border-radius: 16px; font-size: 14.5px; font-weight: 700; background: var(--field); border: 1px solid var(--stroke-reg); display: flex; align-items: center; gap: 7px; transition: transform .14s var(--ease); }
.btn-sm:active { transform: scale(.95); }
.btn-wide { width: 100%; height: 48px; border-radius: 18px; font-size: 15px; font-weight: 700; transition: transform .14s var(--ease); }
.btn-wide:active { transform: scale(.97); }
.btn-danger { color: #fff; background: linear-gradient(150deg, #FF4D6D, #C31F41); }
.btn-ghost { background: var(--field); border: 1px solid var(--stroke-reg); }
.btn-solid { color: #fff; background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000)); }

/* ── Аркуш дій ────────────────────────────────────────────────────────── */
#sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
#sheet-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .24s var(--ease) both; }
@keyframes fade { from { opacity: 0; } }
#sheet-card {
  position: relative; width: 100%; max-width: 460px;
  margin: 0 12px calc(12px + env(safe-area-inset-bottom));
  border-radius: 28px; padding: 22px 20px 20px;
  display: flex; flex-direction: column; gap: 12px;
  max-height: calc(100% - 24px); overflow-y: auto;
  animation: sheetIn .34s cubic-bezier(.22,1.1,.3,1) both;
}
#sheet-card::-webkit-scrollbar { display: none; width: 0; height: 0; }
#sheet h3 { overflow-wrap: anywhere; }
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } }
#sheet.closing #sheet-card { animation: sheetOut .2s var(--ease) both; }
#sheet.closing #sheet-scrim { animation: fade .2s var(--ease) reverse both; }
@keyframes sheetOut { to { transform: translateY(30px); opacity: 0; } }
#sheet h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
#sheet p { margin: -4px 0 0; font-family: var(--serif); font-size: 14px; line-height: 1.5; color: var(--text-2); }
#sheet input[type=text] { height: 48px; border-radius: 16px; padding: 0 14px; width: 100%; border: 1px solid var(--stroke-reg); background: var(--field); outline: none; font-size: 16px; }
.sheet-acts { display: flex; gap: 10px; margin-top: 4px; }
.sheet-acts button { flex: 1; height: 48px; border-radius: 18px; font-size: 15.5px; font-weight: 700; transition: transform .14s var(--ease); }
/* У колонці головна вісь — вертикаль, тож flex:1 з базою 0 з'їдав height:48px
   і кнопки сплющувались до висоти тексту. Тут розмір задає саме height. */
.sheet-acts.col { flex-direction: column; }
.sheet-acts.col button { flex: 0 0 auto; width: 100%; }
.sheet-acts button:active { transform: scale(.96); }

#toast {
  position: fixed; left: 50%; z-index: 60; bottom: calc(104px + env(safe-area-inset-bottom));
  padding: 12px 20px; border-radius: 22px; font-size: 14.5px; font-weight: 600;
  pointer-events: none; opacity: 0; transform: translate(-50%, 12px);
  transition: opacity .24s var(--ease), transform .34s cubic-bezier(.22,1.2,.3,1);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Вимикається системним «менше руху» або тумблером у налаштуваннях. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
}
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after {
  animation-duration: .001s !important; transition-duration: .001s !important;
}
:root[data-motion="off"] #spin, :root[data-motion="off"] .bloom { animation: none !important; }
</style>
</head>
<body>

<div id="bg"><div id="spin"></div></div>
<div id="grain"></div>
<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";

/* ══════════════ Сховище ═══════════════════════════════════════════════
   Дані й налаштування — два окремі записи в localStorage. Нічого нікуди
   не надсилається: закрив вкладку, все лишилось у браузері. */

const KEY = "sklo.v1";
const SKEY = "sklo.settings.v1";

const ACCENTS = ["violet", "teal", "pink", "amber"];
const ACCENT_HEX = { violet: "#7C5CFF", teal: "#20D0C0", pink: "#FF4D8D", amber: "#FFB020" };
const PRESETS = ["#7C5CFF", "#20D0C0", "#FF4D8D", "#FFB020", "#4D9FFF", "#B44DFF"];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

let db = { notes: [], folders: [] };
let cfg = {
  theme: "auto",
  accent: "#7C5CFF",
  bgSpeed: 2,      // 0 — тло завмирає
  bgSeed: 7,
  bgOpacity: 1,
  glass: 100,      // щільність скла, %
  motion: true,
};

function loadCfg() {
  let stored = null;
  try {
    const raw = localStorage.getItem(SKEY);
    if (raw) stored = JSON.parse(raw);
  } catch (e) {}
  if (stored && typeof stored === "object") {
    // Раніше тут жило саме розмиття. Дивимось на збережене, а не на cfg:
    // у cfg вже лежить типова щільність, тож перевірка по ньому не спрацює
    // ніколи.
    if (typeof stored.blur === "number" && typeof stored.glass !== "number") {
      stored.glass = Math.round((stored.blur / 24) * 100);
    }
    delete stored.blur;
    Object.assign(cfg, stored);
  }
  cfg.glass = Math.min(160, Math.max(20, cfg.glass || 100));
}
function saveCfg() {
  try { localStorage.setItem(SKEY, JSON.stringify(cfg)); } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.notes) && Array.isArray(parsed.folders)) {
        db = parsed;
        if (!db.folders.length) db.folders = defaultFolders();
        return;
      }
    }
  } catch (e) { /* зіпсований або недоступний сховок — починаємо з нуля */ }
  seed();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("Не вдалось зберегти — сховище браузера недоступне"); }
}

function defaultFolders() {
  return [
    { id: uid(), name: "Ідеї", accent: "violet" },
    { id: uid(), name: "Робота", accent: "teal" },
    { id: uid(), name: "Побут", accent: "amber" },
    { id: uid(), name: "Особисте", accent: "pink" },
  ];
}

function seed() {
  const folders = defaultFolders();
  db = { folders, notes: [{
    id: uid(),
    title: "Вітаю у Склі",
    body: "Це звичайна нотатка — гортай, правь, видаляй.\n\nГортай пальцем ліворуч, щоб перейти до тек і налаштувань. Тапни «+» унизу, щоб написати свою.",
    folderID: folders[0].id,
    pinned: true, created: Date.now(), updated: Date.now(),
    items: [
      { id: uid(), text: "Написати першу нотатку", done: false },
      { id: uid(), text: "Створити свою теку", done: false },
      { id: uid(), text: "Покрутити тло в налаштуваннях", done: false },
    ],
  }] };
  save();
}

const noteById = (id) => db.notes.find((n) => n.id === id);
const folderById = (id) => db.folders.find((f) => f.id === id) || null;
const accentOf = (note) => {
  const f = folderById(note && note.folderID);
  return f ? ACCENT_HEX[f.accent] : cfg.accent;
};

function displayTitle(n) {
  const t = (n.title || "").trim();
  if (t) return t;
  const first = (n.body || "").split("\n").map((s) => s.trim()).filter(Boolean)[0];
  return first || "Без назви";
}
function preview(n) {
  const b = (n.body || "").trim();
  if (b) return b.replace(/\s*\n+\s*/g, " ");
  const items = (n.items || []).map((i) => i.text).filter(Boolean);
  return items.length ? items.join(" · ") : "Порожня нотатка";
}
function isEmptyNote(n) {
  return !(n.title || "").trim() && !(n.body || "").trim()
    && !(n.items || []).some((i) => (i.text || "").trim());
}
function matches(n, q) {
  q = q.trim().toLowerCase();
  if (!q) return true;
  if ((n.title || "").toLowerCase().includes(q)) return true;
  if ((n.body || "").toLowerCase().includes(q)) return true;
  return (n.items || []).some((i) => (i.text || "").toLowerCase().includes(q));
}

/* ══════════════ Дати ══════════════════════════════════════════════════ */

const MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_SHORT = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const WEEKDAYS = ["Неділя","Понеділок","Вівторок","Середа","Четвер","Пʼятниця","Субота"];

const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const hhmm = (d) => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

function shortStamp(ts) {
  const d = new Date(ts), now = new Date();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, now)) return hhmm(d);
  if (sameDay(d, y)) return "Учора";
  if (d.getFullYear() === now.getFullYear()) return d.getDate() + " " + MONTHS_SHORT[d.getMonth()];
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getFullYear()).slice(2);
}
function fullStamp(ts) {
  const d = new Date(ts), now = new Date();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, now)) return "Сьогодні · " + hhmm(d);
  if (sameDay(d, y)) return "Учора · " + hhmm(d);
  return d.getDate() + " " + MONTHS_GEN[d.getMonth()] + " · " + hhmm(d);
}
function weekdayLine() {
  const d = new Date();
  return WEEKDAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS_GEN[d.getMonth()];
}

/** Місцевий відмінок: «у 1 нотатці», але «у 2 / 11 / 25 нотатках». */
const declension = (n) => (n % 10 === 1 && n % 100 !== 11) ? "нотатці" : "нотатках";
function declensionNom(n) {
  const m100 = n % 100, m10 = n % 10;
  if (m100 >= 11 && m100 <= 14) return "нотаток";
  if (m10 === 1) return "нотатка";
  if (m10 >= 2 && m10 <= 4) return "нотатки";
  return "нотаток";
}

/* ══════════════ Іконки ════════════════════════════════════════════════ */

const ic = (p, s) => '<svg width="' + (s || 21) + '" height="' + (s || 21) +
  '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + p + "</svg>";

const ICONS = {
  list: ic('<path d="M4 6h16M4 12h16M4 18h10"/>'),
  folder: ic('<path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V18a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>'),
  search: ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  gear: ic('<path d="M4 7h9M18.5 7H20M4 12h2.5M11.5 12H20M4 17h7M16 17h4"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="13.5" cy="17" r="2.2"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>', 26),
  plusTiny: ic('<path d="M12 5v14M5 12h14"/>', 16),
  folderPlus: ic('<path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V18a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M12 11v5M9.5 13.5h5"/>', 26),
  shuffle: ic('<path d="M16.5 4.5L20 8l-3.5 3.5M16.5 12.5L20 16l-3.5 3.5M4 8h4l8 8h4M4 16h4l2.4-2.4M13.6 10.4L16 8h4"/>', 24),
  shuffleSm: ic('<path d="M16.5 4.5L20 8l-3.5 3.5M16.5 12.5L20 16l-3.5 3.5M4 8h4l8 8h4M4 16h4l2.4-2.4M13.6 10.4L16 8h4"/>', 17),
  back: ic('<path d="M15 5l-7 7 7 7"/>', 20),
  share: ic('<path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 14v5a2 2 0 002 2h12a2 2 0 002-2v-5"/>', 19),
  trash: ic('<path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/>', 19),
  check: ic('<path d="M5 12.5l4.5 4.5L19 7"/>', 14),
  done: '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  checklist: ic('<path d="M3.5 6.5l1.8 1.8 3-3.4M3.5 13l1.8 1.8 3-3.4M3.5 19.5l1.8 1.8 3-3.4M11.5 6h9M11.5 12.5h9M11.5 19h9"/>', 19),
  minus: ic('<circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/>', 17),
  chevron: ic('<path d="M9 5l7 7-7 7"/>', 15),

  pinFill: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2l8 8-3.2 1.1-3.1 6.4-2.6-2.6-5.6 5.6-1.4-1.4 5.6-5.6-2.6-2.6 6.4-3.1z"/></svg>',

/* ══════════════ Тло ═══════════════════════════════════════════════════
   Сід задає розташування, розміри й відтінки плям. Той самий сід завжди
   дає те саме тло — тому його й можна запамʼятати та повернути. */

function rng(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

const hsl = (h, s, l) => "hsl(" + h + " " + s + "% " + l + "%)";

function buildBackground() {
  const host = document.getElementById("spin");
  const r = rng(cfg.bgSeed * 2654435761);
  const baseHue = Math.floor(r() * 360);
  let html = "";
  for (let i = 0; i < 4; i++) {
    const hue = Math.round((baseHue + i * (70 + r() * 50)) % 360);
    const w = 52 + r() * 34;                 // vmax
    const h = w * (0.72 + r() * 0.46);
    // Карусель удвічі більша за екран, тож видима його частина — це лише
    // середні 25–75 %. Плями за межами цієї смуги просто не видно.
    const x = 34 + r() * 32;                 // %
    const y = 34 + r() * 32;
    const op = 0.38 + r() * 0.22;
    html += '<div class="bloom b' + (i + 1) + '" style="' +
      "width:" + w.toFixed(1) + "vmax;height:" + h.toFixed(1) + "vmax;" +
      "left:" + x.toFixed(1) + "%;top:" + y.toFixed(1) + "%;" +
      "margin-left:-" + (w / 2).toFixed(1) + "vmax;margin-top:-" + (h / 2).toFixed(1) + "vmax;" +
      "--o:" + op.toFixed(3) + ";" +
      "animation-delay:-" + (r() * 20).toFixed(1) + "s;" +
      "background:radial-gradient(closest-side," + hsl(hue, 92, 62) + ",transparent);" +
      '"></div>';
  }
  host.innerHTML = html;
  applyBgSpeed();
}

function applyBgSpeed() {
  const root = document.documentElement.style;
  const k = cfg.bgSpeed;
  const spin = document.getElementById("spin");
  const blooms = document.querySelectorAll("#spin .bloom");
  if (k <= 0) {
    spin.style.animationPlayState = "paused";
    blooms.forEach((b) => { b.style.animationPlayState = "paused"; });
    return;
  }
  spin.style.animationPlayState = "running";
  blooms.forEach((b) => { b.style.animationPlayState = "running"; });
  // Базові періоди взаємно прості, щоб візерунок не повторювався циклом.
  root.setProperty("--spin-dur", Math.round(190 / k) + "s");
  root.setProperty("--d1", (34 / k).toFixed(1) + "s");
  root.setProperty("--d2", (43 / k).toFixed(1) + "s");
  root.setProperty("--d3", (37 / k).toFixed(1) + "s");
  root.setProperty("--d4", (47 / k).toFixed(1) + "s");
}

function applyCfg() {
  const root = document.documentElement;
  const k = cfg.glass / 100;
  root.style.setProperty("--accent", cfg.accent);
  root.style.setProperty("--bg-op", cfg.bgOpacity);
  // Один повзунок веде і заливку поверхонь, і розмиття тих небагатьох
  // елементів, під якими справді проїжджає контент.
  root.style.setProperty("--k", k.toFixed(3));
  root.style.setProperty("--blur", Math.round(6 + 22 * k) + "px");
  root.setAttribute("data-motion", cfg.motion ? "on" : "off");
  if (cfg.theme === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", cfg.theme);
  const dark = cfg.theme === "dark" || (cfg.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#07070d" : "#f4f1fa");
}

const app = document.getElementById("app");

const HEADS = {
  notes: () => [weekdayLine(), "Нотатки"],
  folders: () => [db.notes.length + " " + declensionNom(db.notes.length), "Теки"],
  settings: () => ["Скло · записник", "Налаштування"],
};

function setHead(pane) {
  const host = $("#head-txt");
  const parts = HEADS[pane]();
  const cur = host.querySelector(".ht:not(.out)");
  if (cur && cur.dataset.k === pane && cur.dataset.eye === parts[0]) return;

  const next = document.createElement("div");
  next.className = "ht";
  next.dataset.k = pane;
  next.dataset.eye = parts[0];
  next.innerHTML = '<div class="eyebrow">' + esc(parts[0]) + '</div><h1 class="h1">' + esc(parts[1]) + "</h1>";

  if (!cur || !cfg.motion) {
    host.innerHTML = "";
    host.appendChild(next);
    return;
  }
  // Старий рядок іде вгору рівно тоді, коли новий приходить знизу.
  next.classList.add("in");
  host.appendChild(next);
  cur.classList.add("out");
  cur.addEventListener("animationend", () => cur.remove(), { once: true });
  setTimeout(() => cur.remove(), 600);
}

/** Єдине місце, де рухається сторінка, кружок і текст шапки. */
function setPane(i, opts) {
  i = Math.max(0, Math.min(PANES.length - 1, i));
  ui.pane = i;
  const pane = PANES[i];
  $("#pager").style.setProperty("--p", i);
  setInd(DOCK_OF[pane]);
  setHead(pane);
  const fab = $("#fab");
  fab.innerHTML = pane === "folders" ? ICONS.folderPlus : pane === "settings" ? ICONS.shuffle : ICONS.plus;
  fab.setAttribute("aria-label", pane === "folders" ? "Нова тека" : pane === "settings" ? "Перемішати тло" : "Нова нотатка");
  if (!opts || !opts.quiet) renderPane(pane);
}

function setInd(i) {
  $("#ind").style.setProperty("--i", i);
  app.querySelectorAll(".dock-btn").forEach((b, k) => b.classList.toggle("on", k === i));
}

function renderPane(pane) {
  if (pane === "notes") renderNotes();
  else if (pane === "folders") renderFolders();
  else renderSettings();
}

function renderAll() {
  PANES.forEach(renderPane);
  setHead(PANES[ui.pane]);
}

/* ── Свайпи ───────────────────────────────────────────────────────────── */

function wireSwipe() {
  const pager = $("#pager");
  const ind = $("#ind");
  let x0 = 0, y0 = 0, dx = 0, mode = null, w = 1, t0 = 0;

  pager.addEventListener("touchstart", (e) => {
    // Другий палець посеред свайпу не має збивати режим: інакше touchend
    // вийде раніше й сторінка застрягне між позиціями.
    if (mode === "swipe") return;
    if (e.touches.length !== 1) { mode = "skip"; return; }
    // Стрічка чіпів і повзунки гортаються самі — не перехоплюємо.
    if (e.target.closest(".chips, input[type=range]")) { mode = "skip"; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    dx = 0; mode = null; t0 = Date.now();
    w = pager.clientWidth || 1;
  }, { passive: true });

  pager.addEventListener("touchmove", (e) => {
    if (mode === "skip" || e.touches.length !== 1) return;
    const cx = e.touches[0].clientX - x0;
    const cy = e.touches[0].clientY - y0;
    if (mode === null) {
      if (Math.abs(cx) < 8 && Math.abs(cy) < 8) return;
      // Рішення приймається один раз за жест: або гортаємо сторінки, або
      // віддаємо палець вертикальній прокрутці.
      mode = Math.abs(cx) > Math.abs(cy) * 1.2 ? "swipe" : "skip";
      if (mode === "swipe") { pager.classList.add("dragging"); ind.classList.add("live"); }
    }
    if (mode !== "swipe") return;
    dx = cx;
    // На краях опір: видно, що далі сторінок немає.
    if ((ui.pane === 0 && dx > 0) || (ui.pane === PANES.length - 1 && dx < 0)) dx *= 0.32;
    const pos = ui.pane - dx / w;
    pager.style.setProperty("--p", pos);
    // Кружок їде за пальцем між своїми позиціями, а не стрибає в кінці.
    const from = DOCK_OF[PANES[ui.pane]];
    const toIdx = Math.max(0, Math.min(PANES.length - 1, ui.pane + (dx < 0 ? 1 : -1)));
    const to = DOCK_OF[PANES[toIdx]];
    const t = Math.min(1, Math.abs(dx) / w);
    ind.style.setProperty("--i", (from + (to - from) * t).toFixed(3));
  }, { passive: true });

  // Хай там що обірвало жест — сторінка мусить стати на місце.
  const end = () => {
    if (!pager.classList.contains("dragging")) { mode = null; return; }
    pager.classList.remove("dragging");
    ind.classList.remove("live");
    const speed = Math.abs(dx) / Math.max(1, Date.now() - t0);
    const far = Math.abs(dx) > w * 0.22 || speed > 0.5;
    setPane(far ? ui.pane - Math.sign(dx) : ui.pane);
    mode = null; dx = 0;
  };
  pager.addEventListener("touchend", end);
  pager.addEventListener("touchcancel", end);
  // Згорнули застосунок посеред жесту — повертаємось у рівний стан.
  document.addEventListener("visibilitychange", () => { if (document.hidden) end(); });
}

/* ── Панель ───────────────────────────────────────────────────────────── */

function wireDock() {
  app.querySelectorAll("[data-go]").forEach((el) => {
    el.onclick = () => {
      const go = el.dataset.go;
      if (go === "search") {
        if (ui.pane !== 0) setPane(0);
        setSearching(true);
        return;
      }
      if (ui.searching) setSearching(false);
      setPane(PANES.indexOf(go));
    };
  });

  const q = $("#q");
  q.addEventListener("input", () => { ui.query = q.value; renderNotes({ animate: false }); });
  q.addEventListener("keydown", (e) => { if (e.key === "Escape") setSearching(false); });
  q.addEventListener("blur", () => {
    if (ui.query.trim()) return;
    setTimeout(() => { if (!ui.query.trim() && document.activeElement !== q) setSearching(false); }, 120);
  });

  $("#fab").onclick = () => {
    if (ui.searching) { setSearching(false); return; }
    const pane = PANES[ui.pane];
    if (pane === "folders") { newFolder(); return; }
    if (pane === "settings") { shuffleBg(); return; }
    const note = {
      id: uid(), title: "", body: "", folderID: ui.folderID,
      pinned: false, created: Date.now(), updated: Date.now(), items: [],
    };
    db.notes.push(note);
    save();
    openNote(note.id);
  };
}

function setSearching(on) {
  ui.searching = on;
  app.dataset.search = on ? "on" : "off";
  $("#dock").dataset.mode = on ? "search" : "nav";
  const q = $("#q");
  if (on) {
    setInd(2);
    requestAnimationFrame(() => q.focus());
  } else {
    q.blur();
    setInd(DOCK_OF[PANES[ui.pane]]);
    if (ui.query) { ui.query = ""; q.value = ""; renderNotes(); }
  }
}

/* ── Сторінка: нотатки ────────────────────────────────────────────────── */

function noteCard(n) {
  const f = folderById(n.folderID);
  const a = accentOf(n);
  return '<button class="card g g-flat' + (n.pinned ? " pin" : "") + '" data-open="' + n.id +
    '" style="--row-accent:' + a + '">' +
    '<span class="card-top">' +
      (n.pinned ? '<span style="color:' + a + ';display:flex">' + ICONS.pinTiny + "</span>" : "") +
      '<span class="card-title">' + esc(displayTitle(n)) + "</span>" +
      '<span class="card-time">' + shortStamp(n.updated) + "</span>" +
    "</span>" +
    '<span class="card-prev">' + esc(preview(n)) + "</span>" +
    (f ? '<span class="card-foot"><span class="dot"></span><span class="card-folder">' + esc(f.name) + "</span></span>" : "") +
  "</button>";
}

/** `fresh` — це інший набір нотаток (інша тека, інший екран), а не та сама
 *  вибірка після правки. Тільки він заслуговує на анімацію входу. */
let lastNotesKey = null;

function renderNotes(opts) {
  const host = $("#pane-notes");
  const notes = db.notes
    .filter((n) => !ui.folderID || n.folderID === ui.folderID)
    .filter((n) => matches(n, ui.query))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);

  const chips = [{ id: null, name: "Усі" }].concat(db.folders)
    .map((f) => '<button class="chip g g-flat' + (ui.folderID === f.id ? " on" : "") +
      '" data-folder="' + (f.id || "") + '">' + esc(f.name) + "</button>").join("") +
    '<button class="chip g g-flat chip-add" id="chip-add" aria-label="Нова тека">' + ICONS.plusTiny + "<span>Тека</span></button>";

  const body = notes.length
    ? '<div class="pad">' + notes.map(noteCard).join("") + "</div>"
    : '<div class="empty">' +
        '<span style="color:var(--text-3)">' + (ui.query ? ICONS.search : ICONS.emptyBox) + "</span>" +
        "<h2>" + (ui.query ? "Нічого не знайшлось" : "Тут поки порожньо") + "</h2>" +
        "<p>" + (ui.query ? "Спробуй інші слова або скинь фільтр теки."
                          : "Тапни «+», щоб написати першу нотатку.") + "</p>" +
      "</div>";

  const key = ui.folderID + "|" + (ui.query ? "q" : "") + "|" + notes.length;
  const fresh = (!opts || opts.animate !== false) && key !== lastNotesKey && cfg.motion;
  lastNotesKey = key;

  host.innerHTML = '<div class="chips">' + chips + "</div>" +
    (fresh ? body.replace('class="pad"', 'class="pad fresh"') : body);

  const ph = "Пошук у " + db.notes.length + " " + declension(db.notes.length);
  if ($("#q").placeholder !== ph) $("#q").placeholder = ph;

  host.querySelector("#chip-add").onclick = newFolder;
  host.querySelectorAll("[data-folder]").forEach((el) => {
    el.onclick = () => { ui.folderID = el.dataset.folder || null; renderNotes(); };
  });
  host.querySelectorAll("[data-open]").forEach((el) => {
    el.onclick = () => openNote(el.dataset.open);
    attachLongPress(el, () => noteActions(el.dataset.open));
  });
}

/* ── Сторінка: теки ───────────────────────────────────────────────────── */

function renderFolders() {
  const host = $("#pane-folders");
  const rows = db.folders.map((f) => {
    const mine = db.notes.filter((n) => n.folderID === f.id);
    const last = mine.slice().sort((a, b) => b.updated - a.updated)[0];
    return '<button class="frow g g-flat" data-pick="' + f.id + '" style="--row-accent:' + ACCENT_HEX[f.accent] + '">' +
      '<span class="fic">' + ICONS.folder + "</span>" +
      '<span class="fmeta"><span class="fname">' + esc(f.name) + "</span>" +
      '<span class="flast">' + esc(last ? displayTitle(last) : "Порожня тека") + "</span></span>" +
      '<span class="fcount">' + mine.length + "</span>" +
      '<span style="color:var(--text-3);display:flex">' + ICONS.chevron + "</span>" +
    "</button>";
  }).join("");

  host.innerHTML = '<div class="pad">' +
    '<div class="sect">Мої теки</div>' +
    (rows || '<p style="font-family:var(--serif);color:var(--text-2);padding:0 4px">Тек поки немає. Створи першу великою кнопкою внизу.</p>') +
  "</div>";

  host.querySelectorAll("[data-pick]").forEach((el) => {
    el.onclick = () => { ui.folderID = el.dataset.pick; renderNotes(); setPane(0, { quiet: true }); };
    attachLongPress(el, () => folderActions(el.dataset.pick));
  });
}

        '<p class="set-h">Наліво — панелі майже прозорі й тло проступає наскрізь. Направо — матове скло.</p></div>' +
      '<div class="set"><div class="set-top" style="align-items:center"><span class="set-l">Анімації</span>' +
        '<button class="sw' + (cfg.motion ? " on" : "") + '" id="t-motion" role="switch" aria-label="Анімації"></button></div>' +
        '<p class="set-h">Вимикає переходи, каскади й рух тла.</p></div>' +
    "</div>" +

    '<div class="grp g g-flat">' +
      '<div class="grp-t">Дані</div>' +
      '<p class="set-h" style="margin:0">' + db.notes.length + " " + declensionNom(db.notes.length) +
        " у цьому браузері. Нічого нікуди не надсилається.</p>" +
      '<button class="btn-wide btn-danger" id="b-wipe">Стерти все</button>' +
    "</div>" +

  "</div>";

  host.querySelectorAll("[data-theme]").forEach((el) => {
    el.onclick = () => {
      cfg.theme = el.dataset.theme; saveCfg(); applyCfg();
      host.querySelectorAll("[data-theme]").forEach((x) => x.classList.toggle("on", x === el));
    };
  });
  host.querySelectorAll("[data-accent]").forEach((el) => {
    el.onclick = () => {
      cfg.accent = el.dataset.accent; saveCfg(); applyCfg();
      host.querySelectorAll("[data-accent]").forEach((x) => x.classList.toggle("on", x === el));
      renderNotes();
    };
  });

  const rs = host.querySelector("#r-speed");
  rs.oninput = () => {
    cfg.bgSpeed = +rs.value;
    host.querySelector("#v-speed").textContent = SPEEDS[cfg.bgSpeed];
    applyBgSpeed(); saveCfg();
  };
  const ro = host.querySelector("#r-op");
  ro.oninput = () => {
    cfg.bgOpacity = +ro.value / 100;
    host.querySelector("#v-op").textContent = ro.value + "%";
    applyCfg(); saveCfg();
  };
  const rg = host.querySelector("#r-glass");
  rg.oninput = () => {
    cfg.glass = +rg.value;
    host.querySelector("#v-glass").textContent = cfg.glass + "%";
    applyCfg(); saveCfg();
  };
  host.querySelector("#b-seed").onclick = shuffleBg;
  host.querySelector("#t-motion").onclick = () => {
    cfg.motion = !cfg.motion;
    host.querySelector("#t-motion").classList.toggle("on", cfg.motion);
    applyCfg(); saveCfg();
  };
  host.querySelector("#b-wipe").onclick = wipeAll;
}

function shuffleBg() {
  cfg.bgSeed = Math.floor(Math.random() * 9999) + 1;
  saveCfg();
  buildBackground();
  const el = app.querySelector("#v-seed");
  if (el) el.textContent = "#" + cfg.bgSeed;
  toast("Тло #" + cfg.bgSeed);
}

function wipeAll() {
  sheet("<h3>Стерти все?</h3><p>Зникнуть усі нотатки й теки в цьому браузері. Скасувати буде неможливо.</p>" +
    '<div class="sheet-acts"><button class="btn-ghost" id="w-no">Скасувати</button>' +
    '<button class="btn-danger" id="w-yes">Стерти</button></div>',
    (host, close) => {
      host.querySelector("#w-no").onclick = close;
      host.querySelector("#w-yes").onclick = () => {
        try { localStorage.removeItem(KEY); } catch (e) {}
        seed(); ui.folderID = null; ui.query = "";
        close(); renderAll(); setPane(0);
        toast("Готово, порожньо");
      };
    });
}

/* ── Редактор ─────────────────────────────────────────────────────────── */

function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

function openNote(id) {
  const n = noteById(id);
  if (!n) return;
  ui.noteID = id;
  const f = folderById(n.folderID);

  const ed = document.createElement("div");
  ed.className = "editor";
  ed.id = "editor";
  ed.style.setProperty("--accent", accentOf(n));
  ed.innerHTML =
    '<div class="nav">' +
      '<button class="back g g-reg" id="back">' + ICONS.back + "<span>" + esc(f ? f.name : "Нотатки") + "</span></button>" +
      '<div style="flex:1"></div>' +
      '<button class="icon-btn g g-reg" id="pin" aria-label="Закріпити" style="color:' +
        (n.pinned ? accentOf(n) : "var(--text)") + '">' + (n.pinned ? ICONS.pinFill : ICONS.pin) + "</button>" +
      '<button class="icon-btn g g-reg" id="share" aria-label="Поділитися">' + ICONS.share + "</button>" +
    "</div>" +
    '<div class="ed-scroll"><div class="paper g g-reg">' +
      '<div class="stamp">' + fullStamp(n.updated) + "</div>" +
      '<textarea id="e-title" rows="1" placeholder="Заголовок"></textarea>' +
      '<textarea id="e-body" rows="1" placeholder="Почни писати…"></textarea>' +
      '<div class="todos" id="todos"></div>' +
    "</div></div>" +
    '<div class="dock">' +
      '<div class="edock-bar g g-thick">' +
        '<button class="edock-btn" id="add-item" aria-label="Пункт списку">' + ICONS.checklist + "</button>" +
        '<button class="edock-btn" id="del" aria-label="Видалити">' + ICONS.trash + "</button>" +
      "</div>" +
      '<button class="done-btn" id="done" aria-label="Готово">' + ICONS.done + "</button>" +
    "</div>";
  app.appendChild(ed);

  const title = ed.querySelector("#e-title");
  const body = ed.querySelector("#e-body");
  title.value = n.title || "";
  body.value = n.body || "";
  requestAnimationFrame(() => { grow(title); grow(body); });

  // Поля пишуть у модель напряму — перемальовувати на кожну літеру не можна,
  // бо зникне каретка.
  const touch = () => { n.updated = Date.now(); save(); };
  title.addEventListener("input", () => { n.title = title.value; grow(title); touch(); });
  body.addEventListener("input", () => { n.body = body.value; grow(body); touch(); });

  renderTodos(ed, n);

  ed.querySelector("#back").onclick = closeEditor;
  ed.querySelector("#done").onclick = () => {
    if (document.activeElement) document.activeElement.blur();
    closeEditor();
  };
  ed.querySelector("#add-item").onclick = () => {
    n.items.push({ id: uid(), text: "", done: false });
    touch(); renderTodos(ed, n);
    const inp = ed.querySelectorAll("#todos input");
    if (inp.length) inp[inp.length - 1].focus();
  };
  ed.querySelector("#del").onclick = () => confirmDelete(n.id);
  ed.querySelector("#pin").onclick = () => {
    n.pinned = !n.pinned; touch();
    const b = ed.querySelector("#pin");
    b.innerHTML = n.pinned ? ICONS.pinFill : ICONS.pin;
    b.style.color = n.pinned ? accentOf(n) : "var(--text)";
    toast(n.pinned ? "Закріплено" : "Відкріплено");
  };
  ed.querySelector("#share").onclick = () => shareNote(n);
}

function closeEditor() {
  const ed = document.getElementById("editor");
  if (!ed) return;
  const n = noteById(ui.noteID);
  // Відкрив, нічого не написав, вийшов — не лишаємо сміття в списку.
  if (n && isEmptyNote(n)) { db.notes = db.notes.filter((x) => x.id !== n.id); save(); }
  ui.noteID = null;

  ed.id = "";                         // щоб повторний виклик не знайшов його вдруге
  ed.classList.add("closing");
  const gone = () => ed.remove();
  ed.addEventListener("animationend", gone, { once: true });
  setTimeout(gone, 500);

  renderAll();
}

function renderTodos(ed, n) {
  const host = ed.querySelector("#todos");
  if (!host) return;
  host.innerHTML = n.items.map((it) =>
    '<div class="todo' + (it.done ? " done" : "") + '" data-item="' + it.id + '">' +
      '<button class="box" data-toggle="' + it.id + '" aria-label="Готово">' + ICONS.check + "</button>" +
      '<input type="text" value="' + esc(it.text) + '" placeholder="Пункт">' +
      '<button class="todo-x" data-rm="' + it.id + '" aria-label="Прибрати">' + ICONS.minus + "</button>" +
    "</div>").join("");

  host.querySelectorAll("[data-toggle]").forEach((el) => {
    el.onclick = () => {
      const it = n.items.find((x) => x.id === el.dataset.toggle);
      it.done = !it.done;
      n.updated = Date.now(); save();
      el.closest(".todo").classList.toggle("done", it.done);
      el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    };
  });
  host.querySelectorAll("[data-rm]").forEach((el) => {
    el.onclick = () => {
      n.items = n.items.filter((x) => x.id !== el.dataset.rm);
      n.updated = Date.now(); save(); renderTodos(ed, n);
    };
  });
  host.querySelectorAll(".todo input").forEach((input) => {
    const id = input.closest(".todo").dataset.item;
    input.addEventListener("input", () => {
      const it = n.items.find((x) => x.id === id);
      it.text = input.value; n.updated = Date.now(); save();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      n.items.push({ id: uid(), text: "", done: false });
      save(); renderTodos(ed, n);
      const inp = ed.querySelectorAll("#todos input");
      inp[inp.length - 1].focus();
    });
  });
}

function shareNote(n) {
  const parts = [displayTitle(n)];
  if ((n.body || "").trim()) parts.push(n.body.trim());
  const items = n.items.filter((i) => i.text.trim()).map((i) => (i.done ? "☑ " : "☐ ") + i.text);
  if (items.length) parts.push(items.join("\n"));
  const text = parts.join("\n\n");

  if (navigator.share) navigator.share({ title: displayTitle(n), text }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("Скопійовано")).catch(() => toast("Не вдалось скопіювати"));
  else toast("Браузер не вміє ділитись");
}

/* ── Аркуші дій ───────────────────────────────────────────────────────── */

function sheet(html, wire) {
  const host = document.createElement("div");
  host.id = "sheet";
  host.innerHTML = '<div id="sheet-scrim"></div><div id="sheet-card" class="g g-thick">' + html + "</div>";
  document.body.appendChild(host);
  const close = () => {
    if (!cfg.motion) { host.remove(); return; }
    host.classList.add("closing");
    setTimeout(() => host.remove(), 220);
  };
  host.querySelector("#sheet-scrim").onclick = close;
  wire(host, close);
  return close;
}

function noteActions(id) {
  const n = noteById(id);
  if (!n) return;
  sheet("<h3>" + esc(displayTitle(n)) + "</h3>" +
    '<div class="sheet-acts col">' +
      '<button class="btn-ghost" id="a-pin">' + (n.pinned ? "Відкріпити" : "Закріпити") + "</button>" +
      '<button class="btn-danger" id="a-del">Видалити</button>' +
      '<button class="btn-ghost" id="a-cancel">Скасувати</button></div>',
    (host, close) => {
      host.querySelector("#a-pin").onclick = () => {
        n.pinned = !n.pinned; n.updated = Date.now(); save(); close(); renderNotes();
        toast(n.pinned ? "Закріплено" : "Відкріплено");
      };
      host.querySelector("#a-del").onclick = () => { close(); setTimeout(() => confirmDelete(id), 180); };
      host.querySelector("#a-cancel").onclick = close;
    });
}

function confirmDelete(id) {
  const n = noteById(id);
  if (!n) return;
  sheet("<h3>Видалити нотатку?</h3><p>«" + esc(displayTitle(n)) + "» зникне назавжди.</p>" +
    '<div class="sheet-acts"><button class="btn-ghost" id="d-no">Скасувати</button>' +
    '<button class="btn-danger" id="d-yes">Видалити</button></div>',
    (host, close) => {
      host.querySelector("#d-no").onclick = close;
      host.querySelector("#d-yes").onclick = () => {
        db.notes = db.notes.filter((x) => x.id !== id);
        save(); close();
        if (document.getElementById("editor")) { ui.noteID = null; closeEditor(); }
        else renderAll();
        toast("Видалено");
      };
    });
}

function folderActions(id) {
  const f = folderById(id);
  if (!f) return;
  const count = db.notes.filter((n) => n.folderID === id).length;
  sheet("<h3>" + esc(f.name) + "</h3><p>" +
    (count ? "Нотатки (" + count + ") лишаться, але без теки." : "Тека порожня.") + "</p>" +
    '<div class="sheet-acts"><button class="btn-ghost" id="f-no">Скасувати</button>' +
    '<button class="btn-danger" id="f-yes">Видалити теку</button></div>',
    (host, close) => {
      host.querySelector("#f-no").onclick = close;
      host.querySelector("#f-yes").onclick = () => {
        db.folders = db.folders.filter((x) => x.id !== id);
        db.notes.forEach((n) => { if (n.folderID === id) n.folderID = null; });
        if (ui.folderID === id) ui.folderID = null;
        save(); close(); renderAll();
        toast("Теку видалено");
      };
    });
}

function newFolder() {
  const used = db.folders.map((f) => f.accent);
  // Беремо колір, якого ще немає, — теки мають різнитись з першого погляду.
  let accent = ACCENTS.find((a) => !used.includes(a)) || ACCENTS[db.folders.length % ACCENTS.length];
  sheet("<h3>Нова тека</h3>" +
    '<input type="text" id="f-name" placeholder="Назва" maxlength="40" autocomplete="off">' +
    '<div class="swatches">' + ACCENTS.map((a) =>
      '<button class="swatch' + (a === accent ? " on" : "") + '" data-acc="' + a +
      '" style="background:' + ACCENT_HEX[a] + '" aria-label="' + a + '"></button>').join("") + "</div>" +
    '<div class="sheet-acts"><button class="btn-ghost" id="n-no">Скасувати</button>' +
    '<button class="btn-solid" id="n-yes">Створити</button></div>',
    (host, close) => {
      const input = host.querySelector("#f-name");
      setTimeout(() => input.focus(), 120);
      host.querySelectorAll("[data-acc]").forEach((el) => {
        el.onclick = () => {
          accent = el.dataset.acc;
          host.querySelectorAll("[data-acc]").forEach((x) => x.classList.toggle("on", x === el));
        };
      });
      const commit = () => {
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        const folder = { id: uid(), name, accent };
        db.folders.push(folder);
        save(); close();
        ui.folderID = folder.id;
        renderAll();
        setPane(0, { quiet: true });
        toast("Теку «" + name + "» створено");
      };
      host.querySelector("#n-yes").onclick = commit;
      host.querySelector("#n-no").onclick = close;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); });
    });
}

/* ── Довгий тап ───────────────────────────────────────────────────────── */

function attachLongPress(el, fn) {
  let timer = null, moved = false;
  const start = () => {
    moved = false;
    timer = setTimeout(() => {
      if (moved) return;
      el.dataset.longpress = "1";
      if (navigator.vibrate) navigator.vibrate(12);
      fn();
    }, 460);
  };
  const cancel = () => { moved = true; clearTimeout(timer); };
  el.addEventListener("touchstart", start, { passive: true });
  el.addEventListener("touchmove", cancel, { passive: true });
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchcancel", cancel);
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); fn(); });
  // Тап після довгого утримання не має ще й відкривати нотатку.
  el.addEventListener("click", (e) => {
    if (el.dataset.longpress) { e.stopImmediatePropagation(); delete el.dataset.longpress; }
  }, true);
}

/* ── Старт ────────────────────────────────────────────────────────────── */

// Апаратна «назад» на Android розбирає стан шар за шаром замість виходу.
window.addEventListener("popstate", () => {
  const push = () => history.pushState({ s: 1 }, "");
  const sh = document.getElementById("sheet");
  if (sh) { sh.remove(); push(); return; }
  if (document.getElementById("editor")) { closeEditor(); push(); return; }
  if (ui.searching) { setSearching(false); push(); return; }
  if (ui.pane !== 0) { setPane(0); push(); }
});

/* ── Живе вікно ──────────────────────────────────────────────────────────
   Клавіатура зменшує видиму частину екрана, але не layout. Якщо цього не
   врахувати, браузер прокручує сторінку, щоб показати поле вводу, — і шапка
   їде за край. Тримаємо застосунок рівно у видимій висоті. */
function syncViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty("--vh", Math.round(h) + "px");
  // Body прибитий, але деякі оболонки все одно смикають прокрутку.
  if (window.scrollY !== 0) window.scrollTo(0, 0);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncViewport);
  window.visualViewport.addEventListener("scroll", syncViewport);
}
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", () => setTimeout(syncViewport, 120));
syncViewport();

loadCfg();
applyCfg();
buildBackground();
load();
buildShell();
renderAll();
setPane(0);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyCfg);
history.pushState({ s: 1 }, "");
</script>
